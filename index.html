/* ============================================================
   MODULE PRÉSENTATIONS
   ============================================================ */
function currentDeck(){ return DB.slideDecks.find(d=>d.id===DB.activeDeckId); }

function blankSlide(layout){
  layout = layout || 'title-content';
  const base = { id: uid(), layout, eyebrow:'', title:'', subtitle:'', bodyHtml:'', image:null };
  if (layout === 'title'){ base.title = 'Titre de la présentation'; base.subtitle = 'Sous-titre ou accroche'; }
  else if (layout === 'title-image'){ base.title = 'Titre de la diapositive'; }
  else { base.title = 'Titre de la diapositive'; base.bodyHtml = '<ul><li>Premier point</li><li>Deuxième point</li></ul>'; }
  return base;
}
function blankDeck(title){
  return { id: uid(), title: title || 'Présentation sans titre', theme:'theme-ardoise', slides:[blankSlide('title')], createdAt: nowISO(), updatedAt: nowISO() };
}
function newDeck(silent){
  if (!isPremium() && DB.slideDecks.length >= FREE_LIMITS.maxDecks){
    toast(`Limite gratuite atteinte (${FREE_LIMITS.maxDecks} présentations). Passez à Premium pour continuer.`, true);
    openLicense();
    return;
  }
  const d = blankDeck();
  DB.slideDecks.unshift(d);
  DB.activeDeckId = d.id;
  saveDB();
  renderDeckList();
  loadActiveDeck();
  if (!silent) toast('Nouvelle présentation créée.');
}
function renderDeckList(){
  const list = document.getElementById('docList');
  if (!DB.slideDecks.length){
    list.innerHTML = `<div style="padding:16px 10px;color:var(--text-faint);font-size:12.5px;">Aucune présentation. Cliquez sur + pour commencer.</div>`;
    return;
  }
  list.innerHTML = DB.slideDecks.map(d=>`
    <div class="doc-item ${d.id===DB.activeDeckId?'active':''}" data-id="${d.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>
      <span>${escHtml(d.title)}</span>
      <svg class="del" data-id="${d.id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>
    </div>
  `).join('');
  list.querySelectorAll('.doc-item').forEach(it=>{
    it.addEventListener('click', (e)=>{
      if (e.target.closest('.del')) return;
      DB.activeDeckId = it.dataset.id; saveDB(); renderDeckList(); loadActiveDeck();
    });
  });
  list.querySelectorAll('.del').forEach(d=>{
    d.addEventListener('click', (e)=>{
      e.stopPropagation();
      if (!confirm('Supprimer cette présentation ?')) return;
      DB.slideDecks = DB.slideDecks.filter(x=>x.id!==d.dataset.id);
      if (DB.activeDeckId === d.dataset.id) DB.activeDeckId = DB.slideDecks[0]?.id || null;
      saveDB(); renderDeckList(); loadActiveDeck();
    });
  });
}

let currentSlideIndex = 0;
function loadActiveDeck(){
  currentSlideIndex = 0;
  renderFilmstrip();
  renderSlideCanvas();
}
function scheduleSaveDeck(){
  clearTimeout(scheduleSaveDeck._t);
  scheduleSaveDeck._t = setTimeout(()=>{
    const deck = currentDeck(); if (!deck) return;
    deck.updatedAt = nowISO();
    saveDB();
    renderFilmstrip();
  }, 500);
}

function renderFilmstrip(){
  const deck = currentDeck();
  const strip = document.getElementById('filmstrip');
  if (!deck){ strip.innerHTML = ''; return; }
  strip.innerHTML = deck.slides.map((s,i)=>`
    <div class="film-slide ${deck.theme} ${i===currentSlideIndex?'active':''}" data-i="${i}">
      <span class="fnum">${i+1}</span>
      <div class="fpreview">${slideInnerHtml(s, 0.174)}</div>
    </div>
  `).join('') + `<div class="film-add" id="filmAdd">+ Diapositive</div>`;
  strip.querySelectorAll('.film-slide').forEach(el=>{
    el.addEventListener('click', ()=>{ currentSlideIndex = parseInt(el.dataset.i,10); renderFilmstrip(); renderSlideCanvas(); });
  });
  document.getElementById('filmAdd').onclick = ()=>{
    deck.slides.push(blankSlide('title-content'));
    currentSlideIndex = deck.slides.length-1;
    saveDB(); renderFilmstrip(); renderSlideCanvas();
  };
}

// Génère le contenu visuel d'une diapositive (utilisé pour le rendu principal ET les miniatures, à une échelle donnée)
function slideInnerHtml(s, scale){
  const style = scale ? `style="transform:scale(${1/0.174*scale}); transform-origin:top left; width:${100/scale}%; height:${100/scale}%;"` : '';
  let inner = `<div class="s-accent"></div><div class="s-inner">`;
  if (s.eyebrow) inner += `<div class="s-eyebrow">${escHtml(s.eyebrow)}</div>`;
  inner += `<div class="s-title">${escHtml(s.title)}</div>`;
  if (s.layout === 'title') inner += `<div class="s-subtitle">${escHtml(s.subtitle)}</div>`;
  if (s.layout === 'title-content') inner += `<div class="s-body">${s.bodyHtml || ''}</div>`;
  inner += `</div>`;
  if (s.layout === 'title-image'){
    inner += s.image
      ? `<div class="s-image-wrap"><img src="${s.image}" alt=""></div>`
      : `<div class="s-image-wrap empty">Image</div>`;
  }
  return inner;
}

function renderSlideCanvas(){
  const deck = currentDeck();
  const host = document.getElementById('slideCanvasHost');
  if (!deck || !deck.slides.length){ host.innerHTML = ''; return; }
  const s = deck.slides[currentSlideIndex];
  host.innerHTML = `<div class="slide-canvas ${deck.theme} layout-${s.layout}" id="slideCanvasMain"></div>`;
  const canvas = document.getElementById('slideCanvasMain');
  canvas.innerHTML = `<div class="s-accent"></div><div class="s-inner">
    <div class="s-eyebrow" contenteditable="true" data-field="eyebrow" data-placeholder="Rubrique (facultatif)">${escHtml(s.eyebrow)}</div>
    <div class="s-title" contenteditable="true" data-field="title">${escHtml(s.title)}</div>
    ${s.layout==='title' ? `<div class="s-subtitle" contenteditable="true" data-field="subtitle">${escHtml(s.subtitle)}</div>` : ''}
    ${s.layout==='title-content' ? `<div class="s-body" contenteditable="true" data-field="bodyHtml">${s.bodyHtml||''}</div>` : ''}
  </div>
  ${s.layout==='title-image' ? (s.image
      ? `<div class="s-image-wrap" id="slideImgWrap"><img src="${s.image}" alt=""></div>`
      : `<div class="s-image-wrap empty" id="slideImgWrap">Cliquez pour ajouter une image</div>`) : ''}`;

  // Mettre le sélecteur de mise en page / thème en cohérence
  document.getElementById('layoutSelect').value = s.layout;
  document.getElementById('themeSelect').value = deck.theme;

  wireSlideCanvasEvents();
}

function wireSlideCanvasEvents(){
  const deck = currentDeck(); if (!deck) return;
  const s = deck.slides[currentSlideIndex];
  document.querySelectorAll('#slideCanvasMain [data-field]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const field = el.dataset.field;
      s[field] = field === 'bodyHtml' ? el.innerHTML : el.textContent;
      if (field === 'title'){ const deckTitleGuess = deck.slides[0]?.title; if (deckTitleGuess) deck.title = deckTitleGuess.slice(0,40); }
      scheduleSaveDeck();
    });
  });
  const imgWrap = document.getElementById('slideImgWrap');
  if (imgWrap){
    imgWrap.addEventListener('click', ()=>{
      const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
      inp.onchange = ()=>{
        const f = inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = ()=>{ s.image = r.result; saveDB(); renderSlideCanvas(); renderFilmstrip(); };
        r.readAsDataURL(f);
      };
      inp.click();
    });
  }
}

document.getElementById('layoutSelect').addEventListener('change', e=>{
  const deck = currentDeck(); if (!deck) return;
  const s = deck.slides[currentSlideIndex];
  s.layout = e.target.value;
  if (s.layout === 'title' && !s.subtitle) s.subtitle = 'Sous-titre ou accroche';
  if (s.layout === 'title-content' && !s.bodyHtml) s.bodyHtml = '<ul><li>Premier point</li></ul>';
  saveDB(); renderSlideCanvas(); renderFilmstrip();
});
document.getElementById('themeSelect').addEventListener('change', e=>{
  const deck = currentDeck(); if (!deck) return;
  deck.theme = e.target.value;
  saveDB(); renderSlideCanvas(); renderFilmstrip();
});
document.getElementById('dupSlideBtn').addEventListener('click', ()=>{
  const deck = currentDeck(); if (!deck) return;
  const copy = JSON.parse(JSON.stringify(deck.slides[currentSlideIndex]));
  copy.id = uid();
  deck.slides.splice(currentSlideIndex+1, 0, copy);
  currentSlideIndex++; saveDB(); renderFilmstrip(); renderSlideCanvas();
});
document.getElementById('delSlideBtn').addEventListener('click', ()=>{
  const deck = currentDeck(); if (!deck || deck.slides.length<=1) { toast('Une présentation doit garder au moins une diapositive.', true); return; }
  deck.slides.splice(currentSlideIndex,1);
  currentSlideIndex = Math.max(0, currentSlideIndex-1);
  saveDB(); renderFilmstrip(); renderSlideCanvas();
});
document.getElementById('moveUpBtn').addEventListener('click', ()=>{
  const deck = currentDeck(); if (!deck || currentSlideIndex<=0) return;
  [deck.slides[currentSlideIndex-1], deck.slides[currentSlideIndex]] = [deck.slides[currentSlideIndex], deck.slides[currentSlideIndex-1]];
  currentSlideIndex--; saveDB(); renderFilmstrip(); renderSlideCanvas();
});
document.getElementById('moveDownBtn').addEventListener('click', ()=>{
  const deck = currentDeck(); if (!deck || currentSlideIndex>=deck.slides.length-1) return;
  [deck.slides[currentSlideIndex+1], deck.slides[currentSlideIndex]] = [deck.slides[currentSlideIndex], deck.slides[currentSlideIndex+1]];
  currentSlideIndex++; saveDB(); renderFilmstrip(); renderSlideCanvas();
});
document.getElementById('slideImgBtn').addEventListener('click', ()=>{
  const deck = currentDeck(); if (!deck) return;
  const s = deck.slides[currentSlideIndex];
  if (s.layout !== 'title-image'){ s.layout = 'title-image'; document.getElementById('layoutSelect').value='title-image'; renderSlideCanvas(); }
  document.getElementById('slideImgWrap')?.click();
});

/* ---------- Présentation plein écran ---------- */
const presentOverlay = document.getElementById('presentOverlay');
let presentIndex = 0;
function openPresent(){
  const deck = currentDeck(); if (!deck || !deck.slides.length) return;
  presentIndex = currentSlideIndex;
  presentOverlay.classList.add('open');
  renderPresentSlide();
  if (presentOverlay.requestFullscreen) presentOverlay.requestFullscreen().catch(()=>{});
}
function closePresent(){
  presentOverlay.classList.remove('open');
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
function renderPresentSlide(){
  const deck = currentDeck(); if (!deck) return;
  const s = deck.slides[presentIndex];
  const stage = document.getElementById('presentStage');
  stage.innerHTML = `<div class="slide-canvas ${deck.theme} layout-${s.layout}">${slideInnerHtml(s)}</div>`;
  document.getElementById('presentCounter').textContent = `${presentIndex+1} / ${deck.slides.length}`;
  document.getElementById('presentDots').innerHTML = deck.slides.map((_,i)=>`<span class="${i===presentIndex?'active':''}"></span>`).join('');
}
document.getElementById('presentBtn').onclick = openPresent;
document.getElementById('presentExit').onclick = closePresent;
document.getElementById('presentPrev').onclick = ()=>{ const deck=currentDeck(); if(!deck) return; presentIndex = Math.max(0, presentIndex-1); renderPresentSlide(); };
document.getElementById('presentNext').onclick = ()=>{ const deck=currentDeck(); if(!deck) return; presentIndex = Math.min(deck.slides.length-1, presentIndex+1); renderPresentSlide(); };
window.addEventListener('keydown', (e)=>{
  if (!presentOverlay.classList.contains('open')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') document.getElementById('presentNext').click();
  if (e.key === 'ArrowLeft') document.getElementById('presentPrev').click();
  if (e.key === 'Escape') closePresent();
});

function bulletsFromHtml(html){

/* ---------- Scientifique ---------- */
const CALC_FUNCS = {
  SIN:v=>Math.sin(calcAngleMode==='deg'?v*Math.PI/180:v),
  COS:v=>Math.cos(calcAngleMode==='deg'?v*Math.PI/180:v),
  TAN:v=>Math.tan(calcAngleMode==='deg'?v*Math.PI/180:v),
  ASIN:v=>{const r=Math.asin(v); return calcAngleMode==='deg'? r*180/Math.PI : r;},
  ACOS:v=>{const r=Math.acos(v); return calcAngleMode==='deg'? r*180/Math.PI : r;},
  ATAN:v=>{const r=Math.atan(v); return calcAngleMode==='deg'? r*180/Math.PI : r;},
  LN:v=>Math.log(v), LOG:v=>Math.log10(v), EXP:v=>Math.exp(v),
  SQRT:v=>Math.sqrt(v), ABS:v=>Math.abs(v),
  FACT:v=>{ v=Math.round(v); if(v<0) return NaN; let r=1; for(let i=2;i<=v;i++) r*=i; return r; },
  POW:(a,b)=>Math.pow(a,b)
};
let calcAngleMode = 'deg';
let calcMemory = 0;
let calcExpr = '';
let calcHistory = [];

function evalCalcAst(node){
  switch(node.type){
    case 'num': return node.v;
    case 'neg': return -evalCalcAst(node.expr);
    case 'call': { const fn = CALC_FUNCS[node.name]; if(!fn) throw new Error('Fonction inconnue'); return fn(...node.args.map(evalCalcAst)); }
    case 'bin': {
      const l = evalCalcAst(node.left), r = evalCalcAst(node.right);
      switch(node.op){ case '+':return l+r; case '-':return l-r; case '*':return l*r; case '/': if(r===0) throw new Error('Division par zéro'); return l/r; case '^': return Math.pow(l,r); }
    }
  }
  throw new Error('Expression invalide');
}
function evalCalcExpr(str){
  const ast = parseFormula(str);
  const v = evalCalcAst(ast);
  if (typeof v !== 'number' || isNaN(v)) throw new Error('Erreur');
  return v;
}
function fmtCalc(n){
  if (Math.abs(n) < 1e-9) n = 0;
  return Number(n.toPrecision(12)).toLocaleString('fr-FR', {maximumFractionDigits:10});
}

/* ---------- Matrices ---------- */
function matGrid(id, size){
  let html = `<div class="matrix-grid" style="grid-template-columns:repeat(${size},1fr);">`;
  for (let r=0;r<size;r++) for (let c=0;c<size;c++) html += `<input data-r="${r}" data-c="${c}" value="${r===c?1:0}">`;
  html += '</div>';
  return html;
}
function readMat(container, size){
  const m = Array.from({length:size},()=>Array(size).fill(0));
  container.querySelectorAll('input').forEach(inp=>{ m[+inp.dataset.r][+inp.dataset.c] = parseFloat(inp.value.replace(',','.'))||0; });
  return m;
}
function matAdd(a,b){ return a.map((row,r)=>row.map((v,c)=>v+b[r][c])); }
function matSub(a,b){ return a.map((row,r)=>row.map((v,c)=>v-b[r][c])); }
function matMul(a,b){
  const n=a.length; const out = Array.from({length:n},()=>Array(n).fill(0));
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) for (let k=0;k<n;k++) out[r][c] += a[r][k]*b[k][c];
  return out;
}
function matDet(m){
  const n = m.length;
  if (n===2) return m[0][0]*m[1][1]-m[0][1]*m[1][0];
  if (n===3) return m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1]) - m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0]) + m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
  return NaN;
}
function matTranspose(m){ return m[0].map((_,c)=>m.map(row=>row[c])); }
function matInverse(m){
  const det = matDet(m); if (Math.abs(det) < 1e-12) return null;
  const n = m.length;
  if (n===2) return [[m[1][1]/det, -m[0][1]/det],[-m[1][0]/det, m[0][0]/det]];
  // 3x3 via matrice des cofacteurs
  const cof = (r,c)=>{
    const sub = [];
    for (let i=0;i<3;i++){ if(i===r) continue; const row=[]; for(let j=0;j<3;j++){ if(j===c) continue; row.push(m[i][j]); } sub.push(row); }
    const d = sub[0][0]*sub[1][1]-sub[0][1]*sub[1][0];
    return ((r+c)%2===0?1:-1)*d;
  };
  const cofM = Array.from({length:3},(_,r)=>Array.from({length:3},(_,c)=>cof(r,c)));
  const adj = matTranspose(cofM);
  return adj.map(row=>row.map(v=>v/det));
}
function matToHtml(m){
  if (!m) return '<i>Non inversible (déterminant nul).</i>';
  return '<div class="matrix-grid" style="grid-template-columns:repeat('+m.length+',1fr);pointer-events:none;">' +
    m.flat().map(v=>`<input value="${fmtCalc(v)}" readonly>`).join('') + '</div>';
}
function renderMatCalc(){
  const body = document.getElementById('calcBody');
  body.innerHTML = `
    <div class="calc-row"><label>Taille</label><select id="matSize"><option value="2">2 × 2</option><option value="3">3 × 3</option></select></div>
    <div class="matrix-pair">
      <div class="matrix-block"><b>Matrice A</b><div id="matA"></div></div>
      <div class="matrix-block"><b>Matrice B</b><div id="matB"></div></div>
    </div>
    <div class="calc-row">
      <button class="btn" id="opAdd">A + B</button>
      <button class="btn" id="opSub">A − B</button>
      <button class="btn" id="opMul">A × B</button>
      <button class="btn" id="opDet">det(A)</button>
      <button class="btn" id="opTr">Transposée(A)</button>
      <button class="btn" id="opInv">Inverse(A)</button>
    </div>
    <div class="calc-result" id="matResult"></div>
  `;
  function rebuild(){
    const size = +document.getElementById('matSize').value;
    document.getElementById('matA').innerHTML = matGrid('A', size);
    document.getElementById('matB').innerHTML = matGrid('B', size);
    document.getElementById('matResult').innerHTML = '';
  }
  document.getElementById('matSize').onchange = rebuild;
  rebuild();
  document.getElementById('opAdd').onclick = ()=>{ const s=+document.getElementById('matSize').value; document.getElementById('matResult').innerHTML = matToHtml(matAdd(readMat(document.getElementById('matA'),s), readMat(document.getElementById('matB'),s))); };
  document.getElementById('opSub').onclick = ()=>{ const s=+document.getElementById('matSize').value; document.getElementById('matResult').innerHTML = matToHtml(matSub(readMat(document.getElementById('matA'),s), readMat(document.getElementById('matB'),s))); };
  document.getElementById('opMul').onclick = ()=>{ const s=+document.getElementById('matSize').value; document.getElementById('matResult').innerHTML = matToHtml(matMul(readMat(document.getElementById('matA'),s), readMat(document.getElementById('matB'),s))); };
  document.getElementById('opDet').onclick = ()=>{ const s=+document.getElementById('matSize').value; document.getElementById('matResult').innerHTML = `<b>det(A) = ${fmtCalc(matDet(readMat(document.getElementById('matA'),s)))}</b>`; };
  document.getElementById('opTr').onclick = ()=>{ const s=+document.getElementById('matSize').value; document.getElementById('matResult').innerHTML = matToHtml(matTranspose(readMat(document.getElementById('matA'),s))); };
  document.getElementById('opInv').onclick = ()=>{ const s=+document.getElementById('matSize').value; document.getElementById('matResult').innerHTML = matToHtml(matInverse(readMat(document.getElementById('matA'),s))); };
}

/* ---------- Équations ---------- */
function renderEqCalc(){
  const body = document.getElementById('calcBody');
  body.innerHTML = `
    <h4>Équation linéaire — ax + b = 0</h4>
    <div class="calc-row"><label>a</label><input type="text" id="eqLa" value="2"><label>b</label><input type="text" id="eqLb" value="-4"></div>
    <div class="calc-result" id="eqLResult"></div>

    <h4 style="margin-top:22px;">Équation quadratique — ax² + bx + c = 0</h4>
    <div class="calc-row"><label>a</label><input type="text" id="eqQa" value="1"><label>b</label><input type="text" id="eqQb" value="-3"><label>c</label><input type="text" id="eqQc" value="2"></div>
    <div class="calc-result" id="eqQResult"></div>
  `;
  const n = id=>parseFloat(document.getElementById(id).value.replace(',','.'))||0;
  function computeAll(){
    const a=n('eqLa'), b=n('eqLb');
    document.getElementById('eqLResult').innerHTML = a===0 ? '<i>a ne peut pas être nul.</i>' : `x = <b>${fmtCalc(-b/a)}</b>`;

    const A=n('eqQa'), B=n('eqQb'), C=n('eqQc');
    if (A===0){ document.getElementById('eqQResult').innerHTML = '<i>a ne peut pas être nul (équation non quadratique).</i>'; return; }
    const delta = B*B-4*A*C;
    if (delta > 0){
      const x1=(-B+Math.sqrt(delta))/(2*A), x2=(-B-Math.sqrt(delta))/(2*A);
      document.getElementById('eqQResult').innerHTML = `Δ = ${fmtCalc(delta)} (positif) — x₁ = <b>${fmtCalc(x1)}</b>, x₂ = <b>${fmtCalc(x2)}</b>`;
    } else if (delta === 0){
      document.getElementById('eqQResult').innerHTML = `Δ = 0 — racine double : x = <b>${fmtCalc(-B/(2*A))}</b>`;
    } else {
      const re = -B/(2*A), im = Math.sqrt(-delta)/(2*A);
      document.getElementById('eqQResult').innerHTML = `Δ = ${fmtCalc(delta)} (négatif) — racines complexes : x = <b>${fmtCalc(re)} ± ${fmtCalc(im)}i</b>`;
    }
  }
  document.querySelectorAll('#calcBody input').forEach(inp=> inp.addEventListener('input', computeAll));
  computeAll();
}

async function callClaude(systemPrompt, userText){
  if (!isPremium() && aiCallsRemainingToday() <= 0){
    toast(`Limite gratuite de ${FREE_LIMITS.maxAiCallsPerDay} appels IA/jour atteinte.`, true);
    return null;
  }
  if (!DB.settings.apiKey){
    toast("Ajoutez votre clé API Claude dans Réglages.", true);
    aiTab = 'reglages'; renderAiTabsBar(); renderAiTab();
    return null;
  }
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': DB.settings.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: DB.settings.model || 'claude-sonnet-5',
        max_tokens: 2000,
        system: systemPrompt,
        messages: [{ role:'user', content: userText }]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || 'Erreur API');
    registerAiCall();
    return (data.content||[]).map(b=>b.text||'').join('\n').trim();
  }catch(err){
    toast("Erreur IA : " + err.message, true);
    return null;
  }
}

    aiBody.innerHTML = `<div class="ai-hint">Analyse le contenu de la présentation active et propose des suggestions de structure, de clarté et de mise en forme.</div><div id="sdOut"></div>`;
    aiFoot.innerHTML = `<button class="btn primary" id="sdRun" style="flex:1;">Suggestions IA</button>`;
    document.getElementById('sdRun').onclick = async ()=>{
      const deck = currentDeck();
      if (!deck || !deck.slides.length){ toast('Aucune présentation active.', true); return; }
      const summary = deck.slides.map((s,i)=> `Diapo ${i+1} [${s.layout}] — Titre: ${s.title || '(vide)'} ${s.subtitle?('— Sous-titre: '+s.subtitle):''} ${s.bodyHtml? '— Contenu: '+s.bodyHtml.replace(/<[^>]+>/g,' ').trim() : ''}`).join('\n');
      setBusy(true);
      const out = await callClaude("Tu es l'Agent Présentations d'Office Songda. Analyse ce plan de présentation (une ligne par diapositive) et donne, en français, 3 à 6 suggestions concrètes et courtes pour améliorer la clarté, la structure ou l'impact visuel. Réponds en liste à puces uniquement.", summary);
      setBusy(false);
      if (out) document.getElementById('sdOut').innerHTML = `<div class="ai-result">${escHtml(out)}</div>`;
    };
    return;
  }

  if (aiTab === 'resoudre'){
    aiBody.innerHTML = `
      <div class="ai-hint">Décrivez un problème (mathématiques, physique, chimie, finance, ingénierie…) en français. L'Agent Calcul le résout étape par étape.</div>
      <label>Énoncé du problème</label>
      <textarea id="solvePrompt" rows="6" placeholder="Ex : Un capital de 500 000 FCFA est placé à 6% par an pendant 3 ans à intérêts composés. Quel est le montant final ?"></textarea>
      <div id="solveOut"></div>
    `;
    aiFoot.innerHTML = `<button class="btn primary" id="solveRun" style="flex:1;">Résoudre</button>`;
    document.getElementById('solveRun').onclick = async ()=>{
      const prompt = document.getElementById('solvePrompt').value.trim();
      if (!prompt){ toast('Décrivez le problème à résoudre.', true); return; }
      setBusy(true);
      const out = await callClaude("Tu es l'Agent Calcul d'Office Songda. Résous ce problème (mathématiques, physique, chimie, finance ou ingénierie) étape par étape, en français, avec les formules utilisées et le résultat final clairement mis en évidence à la fin. Reste rigoureux et concis.", prompt);
      setBusy(false);
      if (out) document.getElementById('solveOut').innerHTML = `<div class="ai-result">${escHtml(out)}</div>`;
    };
    return;
  }

  if (aiTab === 'reglages'){
    aiBody.innerHTML = `
      <label>Clé API Claude (Anthropic)</label>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." value="${escHtml(DB.settings.apiKey)}">
      <div class="ai-hint">Votre clé reste uniquement sur cet appareil (localStorage), jamais transmise ailleurs qu'à l'API Anthropic.</div>
      <label>Modèle</label>
      <select id="modelInput">
        <option value="claude-sonnet-5" ${DB.settings.model==='claude-sonnet-5'?'selected':''}>Claude Sonnet 5</option>
        <option value="claude-opus-4-8" ${DB.settings.model==='claude-opus-4-8'?'selected':''}>Claude Opus 4.8</option>
        <option value="claude-haiku-4-5-20251001" ${DB.settings.model==='claude-haiku-4-5-20251001'?'selected':''}>Claude Haiku 4.5 (rapide)</option>
      </select>
      <div class="ai-hint">Appels IA restants aujourd'hui : ${remain}${isPremium()?'':' / '+FREE_LIMITS.maxAiCallsPerDay}</div>
    `;
    aiFoot.innerHTML = `<button class="btn primary" id="saveSettingsBtn" style="flex:1;">Enregistrer</button>`;
    document.getElementById('saveSettingsBtn').onclick = ()=>{
      DB.settings.apiKey = document.getElementById('apiKeyInput').value.trim();
      DB.settings.model = document.getElementById('modelInput').value;
      saveDB(); toast('Réglages enregistrés.');
    };
    return;
  }

  if (aiTab === 'generer'){
    aiBody.innerHTML = `
      <label>Décrivez le document à générer</label>
      <textarea id="genPrompt" rows="4" placeholder="Ex : une lettre de motivation pour un poste de comptable, ton formel, 250 mots"></textarea>
      <label>Type de document</label>
      <select id="genType">
        <option>Lettre administrative</option><option>Contrat</option><option>Rapport</option>
        <option>Facture</option><option>CV</option><option>Note de service</option><option>Procès-verbal</option>
      </select>
      <div id="genOut"></div>
    `;
    aiFoot.innerHTML = `<button class="btn primary" id="genRun" style="flex:1;">Générer</button>`;
    document.getElementById('genRun').onclick = async ()=>{
      const prompt = document.getElementById('genPrompt').value.trim();
      const type = document.getElementById('genType').value;
      if (!prompt){ toast('Décrivez le document souhaité.', true); return; }
      setBusy(true);
      const out = await callClaude(
        "Tu es l'Agent Documents d'Office Songda. Rédige des documents professionnels en français, prêts à l'emploi, avec une mise en page claire (titres en majuscules ou markdown simple). Réponds uniquement avec le contenu du document, sans commentaire.",
        `Type de document : ${type}\nInstructions : ${prompt}`
      );
      setBusy(false);
      if (out){
        document.getElementById('genOut').innerHTML = `<div class="ai-result">${escHtml(out)}</div><button class="btn" id="insertGenBtn" style="margin-top:8px;width:100%;">Insérer dans le document</button>`;
        document.getElementById('insertGenBtn').onclick = ()=>{
          const html = out.split('\n').map(l=>l.trim()?`<p>${escHtml(l)}</p>`:'').join('');
          pageBody.focus(); document.execCommand('insertHTML', false, html); scheduleSave(); closeDrawer();
          toast('Document inséré.');
        };
      }
    };
    return;
  }

  if (aiTab === 'traduire'){
    aiBody.innerHTML = `
      <div class="ai-hint">Traduit le texte sélectionné (ou tout le document si rien n'est sélectionné).</div>
      <label>Langue cible</label>
      <select id="trLang"><option>Anglais</option><option>Espagnol</option><option>Arabe</option><option>Portugais</option><option>Mooré</option><option>Dioula</option></select>
      <div id="trOut"></div>
    `;
    aiFoot.innerHTML = `<button class="btn primary" id="trRun" style="flex:1;">Traduire</button>`;
    document.getElementById('trRun').onclick = async ()=>{
      const sel = window.getSelection().toString();
      const src = sel || pageBody.textContent;
      if (!src.trim()){ toast('Aucun texte à traduire.', true); return; }
      const lang = document.getElementById('trLang').value;
      setBusy(true);
      const out = await callClaude(`Tu es un traducteur professionnel. Traduis fidèlement le texte fourni en ${lang}. Réponds uniquement avec la traduction.`, src);
      setBusy(false);
      if (out) document.getElementById('trOut').innerHTML = `<div class="ai-result">${escHtml(out)}</div>`;
    };
    return;
  }

  if (aiTab === 'analyser'){
    const issues = detectSheetErrors();
    aiBody.innerHTML = `
      <div class="ai-hint">Détection automatique des erreurs de formules et suggestions sur la feuille active.</div>
      ${issues.length ? issues.map(i=>`<div class="ai-issue" data-ref="${i.ref}"><b>${i.ref}</b> — ${escHtml(i.msg)}</div>`).join('') : '<div class="ai-hint">Aucune erreur détectée. 👍</div>'}
      <div id="suggOut"></div>
    `;
    aiBody.querySelectorAll('.ai-issue').forEach(el=>{
      el.onclick = ()=>{ closeDrawer(); focusCell(el.dataset.ref); };
    });
    aiFoot.innerHTML = `<button class="btn primary" id="suggRun" style="flex:1;">Suggestions IA</button>`;
    document.getElementById('suggRun').onclick = async ()=>{
      setBusy(true);
      const csv = sheetToCSV(6);
      const out = await callClaude("Tu es l'Agent Tableur d'Office Songda. Analyse ce tableau de données (format CSV) et donne, en français, 3 à 5 suggestions concrètes et courtes (formules utiles, mise en forme, points de vigilance). Réponds en liste à puces uniquement.", csv);
      setBusy(false);
      if (out) document.getElementById('suggOut').innerHTML = `<div class="ai-result">${escHtml(out)}</div>`;
    };
    return;
  }

  if (aiTab === 'previsions'){
    aiBody.innerHTML = `
      <div class="ai-hint">Prévision par régression linéaire sur une ligne ou colonne de valeurs numériques.</div>
      <label>Plage de données (ex : B2:B8)</label>
      <input type="text" id="fcRange" placeholder="B2:B8">
      <label>Nombre de valeurs à prévoir</label>
      <input type="text" id="fcN" value="3">
      <div id="fcOut"></div>
    `;
    aiFoot.innerHTML = `<button class="btn primary" id="fcRun" style="flex:1;">Calculer la prévision</button>`;
    document.getElementById('fcRun').onclick = ()=>{
      const range = document.getElementById('fcRange').value.trim();
      const n = Math.max(1, parseInt(document.getElementById('fcN').value,10) || 3);
      try{
        const vals = rangeValues(range).map(Number).filter(v=>!isNaN(v));
        if (vals.length < 2) throw new Error('Il faut au moins 2 valeurs numériques.');
        const preds = linearForecast(vals, n);
        document.getElementById('fcOut').innerHTML = `<div class="ai-result">Valeurs connues : ${vals.join(', ')}\n\nPrévision (${n} valeur${n>1?'s':''}) :\n${preds.map(p=>p.toFixed(2)).join(', ')}</div>`;
      }catch(err){ toast(err.message, true); }
    };
    return;
  }

  if (aiTab === 'rapport'){
    aiBody.innerHTML = `<div class="ai-hint">Génère un rapport automatique (résumé, tendances, anomalies, recommandations) à partir de la feuille active.</div><div id="repOut"></div>`;
    aiFoot.innerHTML = `<button class="btn primary" id="repRun" style="flex:1;">Générer le rapport</button>`;
    document.getElementById('repRun').onclick = async ()=>{
      setBusy(true);
      const csv = sheetToCSV(12);
      const out = await callClaude("Tu es l'Agent Tableur d'Office Songda. À partir de ces données (CSV), rédige un rapport structuré et concis en français avec ces sections : Résumé, Tendances, Anomalies, Recommandations. Reste factuel et bref.", csv);
      setBusy(false);
      if (out){
        document.getElementById('repOut').innerHTML = `<div class="ai-result">${escHtml(out)}</div><button class="btn" id="insertRepBtn" style="margin-top:8px;width:100%;">Copier dans le presse-papiers</button>`;
        document.getElementById('insertRepBtn').onclick = ()=>{ navigator.clipboard?.writeText(out).then(()=>toast('Rapport copié.')); };
      }
    };
    return;
  }

  // corriger / reformuler / resumer partagent le même schéma
  const cfg = {
    corriger: { label:'Corriger', hint:"Corrige l'orthographe et la grammaire du texte sélectionné (ou du document entier).", sys:"Tu es un correcteur professionnel francophone. Corrige uniquement l'orthographe, la grammaire et la ponctuation, sans changer le style ni le sens. Réponds uniquement avec le texte corrigé." },
    reformuler: { label:'Reformuler', hint:"Reformule le texte sélectionné dans un style plus clair ou plus professionnel.", sys:"Tu es un rédacteur professionnel francophone. Reformule le texte fourni pour le rendre plus clair et professionnel, en conservant le sens exact. Réponds uniquement avec le texte reformulé." },
    resumer: { label:'Résumer', hint:"Génère un résumé concis du texte sélectionné ou du document entier.", sys:"Tu es un assistant de synthèse. Résume le texte fourni en français de façon concise et fidèle. Réponds uniquement avec le résumé." }
  }[aiTab];

  aiBody.innerHTML = `<div class="ai-hint">${cfg.hint}</div><div id="opOut"></div>`;
  aiFoot.innerHTML = `<button class="btn primary" id="opRun" style="flex:1;">${cfg.label}</button>`;
  document.getElementById('opRun').onclick = async ()=>{
    const sel = window.getSelection().toString();
    const src = sel || pageBody.textContent;
    if (!src.trim()){ toast('Aucun texte à traiter.', true); return; }
    setBusy(true);
    const out = await callClaude(cfg.sys, src);
    setBusy(false);
    if (out){
      document.getElementById('opOut').innerHTML = `<div class="ai-result">${escHtml(out)}</div><button class="btn" id="applyOpBtn" style="margin-top:8px;width:100%;">${sel ? 'Remplacer la sélection' : 'Remplacer le document'}</button>`;
      document.getElementById('applyOpBtn').onclick = ()=>{
        if (sel){
          document.execCommand('insertText', false, out);
        } else {
          pageBody.innerText = out;
        }
        scheduleSave(); closeDrawer(); toast('Texte mis à jour.');
      };
    }
  };
}
function setBusy(b){
  const btn = aiFoot.querySelector('button');
  if (!btn) return;
  btn.disabled = b;
  btn.innerHTML = b ? '<span class="spin"></span> Traitement…' : btn.dataset.label || btn.innerHTML;
}

/* ============================================================
   EXPORT
   ============================================================ */
const exportOverlay = document.getElementById('exportOverlay');
document.getElementById('exportBtn').onclick = ()=>{ renderExportModal(); exportOverlay.classList.add('open'); };
document.getElementById('closeExport').onclick = ()=> exportOverlay.classList.remove('open');
exportOverlay.addEventListener('click', e=>{ if(e.target===exportOverlay) exportOverlay.classList.remove('open'); });

function renderExportModal(){
  const wm = isPremium() ? '' : `<div class="ai-hint">Version gratuite : un filigrane "Office Songda" sera ajouté à l'export.</div>`;
  const body = document.getElementById('exportBody');
  if (currentModule === 'sheet'){
    body.innerHTML = `
      <button class="btn" id="expPdf" style="justify-content:flex-start;padding:13px 14px;">🖨️&nbsp; Imprimer / Exporter en PDF</button>
      <button class="btn" id="expXls" style="justify-content:flex-start;padding:13px 14px;">📊&nbsp; Exporter en .xlsx (Excel)</button>
      <button class="btn" id="expCsv" style="justify-content:flex-start;padding:13px 14px;">🧾&nbsp; Exporter en .csv</button>
      ${wm}`;
    document.getElementById('expPdf').onclick = ()=>{
      exportOverlay.classList.remove('open');
      document.body.classList.add('print-sheet');
      window.print();
      setTimeout(()=> document.body.classList.remove('print-sheet'), 500);
    };
    document.getElementById('expCsv').onclick = ()=>{
      const csv = sheetToCSV(999);
      downloadBlob(csv, (currentSheet()?.title||'feuille') + '.csv', 'text/csv;charset=utf-8');
      exportOverlay.classList.remove('open');
    };
    document.getElementById('expXls').onclick = async ()=>{
      const sheet = currentSheet(); if (!sheet) return;
      const btn = document.getElementById('expXls');
      btn.disabled = true; btn.textContent = 'Génération…';
      const blob = await buildXlsxBlob(sheet);
      btn.disabled = false; btn.innerHTML = '📊&nbsp; Exporter en .xlsx (Excel)';
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = (sheet.title||'feuille') + '.xlsx';
      document.body.appendChild(a); a.click(); a.remove();
      toast('Fichier exporté : ' + (sheet.title||'feuille') + '.xlsx');
      exportOverlay.classList.remove('open');
    };
  } else if (currentModule === 'slides'){
    body.innerHTML = `
      <button class="btn" id="expSlidesPdf" style="justify-content:flex-start;padding:13px 14px;">🖨️&nbsp; Imprimer / Exporter en PDF</button>
      <button class="btn" id="expPptx" style="justify-content:flex-start;padding:13px 14px;">📽️&nbsp; Exporter en .pptx (PowerPoint)</button>
      ${wm}`;
    document.getElementById('expSlidesPdf').onclick = ()=>{
      exportOverlay.classList.remove('open');
      exportSlidesPdf();
    };
    document.getElementById('expPptx').onclick = async ()=>{
      const deck = currentDeck(); if (!deck) return;
      const btn = document.getElementById('expPptx');
      btn.disabled = true; btn.textContent = 'Génération…';
      const blob = await buildPptxBlob(deck);
      btn.disabled = false; btn.innerHTML = '📽️&nbsp; Exporter en .pptx (PowerPoint)';
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = (deck.title||'presentation') + '.pptx';
      document.body.appendChild(a); a.click(); a.remove();
      toast('Fichier exporté : ' + (deck.title||'presentation') + '.pptx');
      exportOverlay.classList.remove('open');
    };
  } else {
    body.innerHTML = `
      <button class="btn" id="expPdf" style="justify-content:flex-start;padding:13px 14px;">📄&nbsp; Imprimer / Exporter en PDF</button>
      <button class="btn" id="expDoc" style="justify-content:flex-start;padding:13px 14px;">📝&nbsp; Exporter en .doc (Word)</button>
      <button class="btn" id="expHtml" style="justify-content:flex-start;padding:13px 14px;">🌐&nbsp; Exporter en .html</button>
      ${wm}`;
    document.getElementById('expPdf').onclick = ()=>{ exportOverlay.classList.remove('open'); window.print(); };
    document.getElementById('expHtml').onclick = ()=>{
      const d = buildExportHtml();
      const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>${escHtml(d.title)}</title>
      <style>body{font-family:Georgia,serif;max-width:820px;margin:40px auto;padding:0 20px;line-height:1.65;color:#20221F;}
      table{border-collapse:collapse;width:100%;}td,th{border:1px solid #ccc;padding:6px 10px;}</style></head>
      <body><div>${d.header}</div><hr>${d.body}<hr><footer style="font-size:12px;color:#888;">${escHtml(d.footer)}</footer></body></html>`;
      downloadBlob(html, (d.title||'document') + '.html', 'text/html');
      exportOverlay.classList.remove('open');
    };
    document.getElementById('expDoc').onclick = ()=>{
      const d = buildExportHtml();
      const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
      <head><meta charset="UTF-8"><title>${escHtml(d.title)}</title></head>
      <body style="font-family:Georgia,serif;line-height:1.6;">${d.header}<hr>${d.body}<hr><p style="font-size:11px;color:#888;">${escHtml(d.footer)}</p></body></html>`;
      downloadBlob(html, (d.title||'document') + '.doc', 'application/msword');
      exportOverlay.classList.remove('open');
    };
  }
}

function buildExportHtml(){
  const doc = currentDoc();
  const title = doc ? doc.title : 'Document';
  const wm = isPremium() ? '' : `<p style="text-align:center;color:#a8a595;font-size:11px;margin-top:30px;">— Créé avec Office Songda · version gratuite —</p>`;
  return { title, header: pageHeader.innerHTML, body: pageBody.innerHTML + wm, footer: pageFooter.textContent };
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Fichier exporté : ' + filename);
}

window.addEventListener('afterprint', ()=> document.body.classList.remove('print-sheet'));

/* ============================================================
   PWA — service worker
   ============================================================ */
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ============================================================
   INITIALISATION
   ============================================================ */
checkLicenseValidity();
renderTierBadge();
if (!DB.documents.length) newDocument(true);
renderDocList();
loadActiveDoc();

window.addEventListener('beforeunload', ()=>{ // dernière sauvegarde de sécurité
  const doc = currentDoc();
  if (doc){ doc.header = pageHeader.innerHTML; doc.body = pageBody.innerHTML; doc.footer = pageFooter.textContent; saveDB(); }
});

})();
</script>
</body>
