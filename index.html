<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Office Songda — Traitement de texte intelligent</title>
<meta name="description" content="Rédigez, corrigez et mettez en forme vos documents professionnels avec l'aide d'agents IA. Contrats, lettres, rapports, CV — tout, hors ligne.">
<meta name="theme-color" content="#14161B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg-app:#14161B;
  --bg-panel:#1B1E25;
  --bg-panel-raised:#20232B;
  --border:rgba(237,234,225,0.09);
  --border-strong:rgba(237,234,225,0.16);
  --ink:#1B6B5C;
  --ink-bright:#2E9C84;
  --brass:#B8863B;
  --brass-bright:#D4A356;
  --paper:#F7F5EE;
  --paper-shadow:rgba(0,0,0,0.45);
  --text:#EDEAE1;
  --text-dim:#9C9A92;
  --text-faint:#6C6A64;
  --danger:#C1554A;
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg-app);
  color:var(--text);
  font-family:var(--font-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--ink);color:#fff;}
input,select,textarea{font-family:inherit;}

/* ===== App shell ===== */
#app{display:flex;flex-direction:column;height:100%;}

.topbar{
  display:flex;align-items:center;gap:14px;
  padding:10px 16px;
  background:var(--bg-panel);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  z-index:40;
}
.brand{
  font-family:var(--font-display);
  font-weight:600;
  font-size:19px;
  letter-spacing:0.2px;
  color:var(--text);
  user-select:none;
  cursor:default;
  display:flex;align-items:center;gap:8px;
}
.brand .nib{width:16px;height:16px;flex-shrink:0;color:var(--brass-bright);}
.brand .tier-badge{
  font-family:var(--font-mono);
  font-size:9.5px;
  letter-spacing:0.6px;
  padding:2px 7px;
  border-radius:20px;
  border:1px solid var(--border-strong);
  color:var(--text-dim);
  text-transform:uppercase;
}
.brand .tier-badge.premium{color:#14161B;background:var(--brass-bright);border-color:var(--brass-bright);font-weight:600;}

.module-tabs{display:flex;gap:2px;background:var(--bg-app);padding:3px;border-radius:9px;margin-left:6px;}
.module-tab{
  padding:6px 13px;border:none;background:transparent;color:var(--text-dim);
  border-radius:7px;font-size:13px;font-weight:500;transition:.15s;
}
.module-tab.active{background:var(--bg-panel-raised);color:var(--text);}
.module-tab:disabled{opacity:.35;cursor:not-allowed;}
.module-tab .soon{font-size:9px;color:var(--brass-bright);margin-left:4px;vertical-align:2px;}

.topbar-spacer{flex:1;}
.topbar-actions{display:flex;gap:6px;align-items:center;}
.icon-btn{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--text-dim);
}
.icon-btn:hover{background:var(--bg-panel-raised);color:var(--text);}
.icon-btn svg{width:17px;height:17px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:8px;border:1px solid var(--border-strong);
  background:var(--bg-panel-raised);color:var(--text);font-size:13px;font-weight:500;
}
.btn:hover{border-color:var(--text-dim);}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn.primary:hover{background:var(--ink-bright);border-color:var(--ink-bright);}
.btn.ghost{background:transparent;}
.btn svg{width:15px;height:15px;}

/* ===== Layout body ===== */
.body-row{flex:1;display:flex;min-height:0;}

.sidebar{
  width:230px;flex-shrink:0;background:var(--bg-panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:margin-left .2s;
}
.sidebar.collapsed{margin-left:-230px;}
.sidebar-head{padding:14px 14px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);display:flex;justify-content:space-between;align-items:center;}
.doc-list{flex:1;overflow-y:auto;padding:4px 8px;}
.doc-item{
  padding:9px 10px;border-radius:8px;margin-bottom:2px;cursor:pointer;
  display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:13px;
}
.doc-item:hover{background:var(--bg-panel-raised);}
.doc-item.active{background:var(--bg-panel-raised);color:var(--text);}
.doc-item svg{width:14px;height:14px;flex-shrink:0;opacity:.7;}
.doc-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.doc-item .del{opacity:0;width:20px;height:20px;flex-shrink:0;color:var(--text-faint);}
.doc-item:hover .del{opacity:1;}
.doc-item .del:hover{color:var(--danger);}
.sidebar-foot{padding:10px;border-top:1px solid var(--border);}

.editor-wrap{flex:1;min-width:0;display:flex;flex-direction:column;background:#0F1116;}

.toolbar{
  display:flex;align-items:center;gap:3px;flex-wrap:wrap;
  padding:8px 14px;background:var(--bg-panel);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.toolbar select{
  background:var(--bg-panel-raised);color:var(--text);border:1px solid var(--border-strong);
  border-radius:6px;padding:6px 8px;font-size:12.5px;max-width:118px;
}
.toolbar .sep{width:1px;height:22px;background:var(--border-strong);margin:0 5px;}
.tbtn{
  width:30px;height:30px;border-radius:6px;border:1px solid transparent;background:transparent;
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;
}
.tbtn:hover{background:var(--bg-panel-raised);color:var(--text);}
.tbtn.active{background:var(--ink);color:#fff;}
.tbtn svg{width:15px;height:15px;}
input[type=color].swatch{width:28px;height:28px;padding:2px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-panel-raised);}

.paper-scroll{flex:1;overflow-y:auto;padding:36px 20px 120px;}
.paper{
  max-width:820px;margin:0 auto;background:var(--paper);color:#20221F;
  border-radius:3px;box-shadow:0 20px 50px var(--paper-shadow);
  font-family:'Georgia',serif;line-height:1.65;
}
.paper-header{padding:18px 60px 0;font-size:12px;color:#8a8778;min-height:20px;border-bottom:1px dashed #d8d5c8;outline:none;}
.paper-body{padding:44px 60px;min-height:600px;font-size:15.5px;outline:none;}
.paper-body:empty:before{content:attr(data-placeholder);color:#a8a595;}
.paper-body h1{font-size:26px;margin:0 0 14px;font-family:var(--font-display);}
.paper-body h2{font-size:20px;margin:22px 0 10px;font-family:var(--font-display);}
.paper-body table{border-collapse:collapse;width:auto;margin:14px 0;}
.paper-body table td,.paper-body table th{border:1px solid #cfcbba;padding:7px 10px;font-size:14px;}
.paper-body img{max-width:100%;border-radius:2px;}
.paper-body img.align-left,.paper-body table.align-left{float:left;margin:4px 18px 10px 0;}
.paper-body img.align-center,.paper-body table.align-center{display:block;float:none;margin:14px auto;}
.paper-body img.align-right,.paper-body table.align-right{float:right;margin:4px 0 10px 18px;}
.paper-body .elem-selected{outline:2px solid #1B6B5C;outline-offset:2px;}

/* Mini barre d'alignement flottante pour image/tableau/signature */
.elem-align-bar{
  position:fixed;display:none;gap:2px;padding:4px;
  background:var(--bg-panel,#1c1e26);border:1px solid var(--border-strong,#333);
  border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:500;
}
.elem-align-bar.open{display:flex;}
.elem-align-bar button{
  width:28px;height:28px;border-radius:6px;border:1px solid transparent;background:transparent;
  color:var(--text-dim,#aaa);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.elem-align-bar button:hover{background:var(--bg-panel-raised,#2a2d38);color:var(--text,#fff);}
.elem-align-bar button.active{background:var(--ink,#1B6B5C);color:#fff;}
.elem-align-bar button svg{width:15px;height:15px;pointer-events:none;}
.elem-align-sep{width:1px;height:20px;background:var(--border-strong,#333);margin:0 3px;align-self:center;}
.paper-body .toc-block{background:#efece0;border-left:3px solid var(--ink);padding:12px 16px;margin:14px 0;border-radius:2px;}
.paper-body .toc-block a{color:#1B6B5C;text-decoration:none;font-size:13.5px;display:block;padding:2px 0;}
.paper-body hr.page-break{border:none;border-top:2px dashed #c9c6b8;margin:26px 0;position:relative;}
.paper-body hr.page-break::after{content:'Saut de page';position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--paper);padding:0 8px;font-family:var(--font-mono);font-size:9px;color:#a8a595;letter-spacing:.5px;}
.paper-footer{padding:0 60px 18px;font-size:11px;color:#8a8778;min-height:18px;border-top:1px dashed #d8d5c8;outline:none;display:flex;justify-content:space-between;}

/* ===== AI Drawer ===== */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;opacity:0;pointer-events:none;transition:.2s;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.ai-drawer{
  position:fixed;top:0;right:0;bottom:0;width:380px;max-width:92vw;background:var(--bg-panel);
  border-left:1px solid var(--border);z-index:61;transform:translateX(100%);transition:.25s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
}
.ai-drawer.open{transform:translateX(0);}
.ai-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.ai-head .nib{width:20px;height:20px;color:var(--brass-bright);}
.ai-head h3{margin:0;font-family:var(--font-display);font-size:16px;font-weight:600;flex:1;}
.ai-tabs{display:flex;gap:4px;padding:10px 14px 0;flex-wrap:wrap;}
.ai-tab{padding:6px 10px;border-radius:7px;border:1px solid var(--border-strong);background:transparent;color:var(--text-dim);font-size:12px;}
.ai-tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.ai-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.ai-body label{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);}
.ai-body textarea, .ai-body select, .ai-body input[type=text], .ai-body input[type=password]{
  width:100%;background:var(--bg-panel-raised);border:1px solid var(--border-strong);border-radius:8px;
  color:var(--text);padding:10px 12px;font-size:13.5px;resize:vertical;
}
.ai-hint{font-size:12px;color:var(--text-faint);line-height:1.5;}
.ai-result{background:var(--bg-panel-raised);border:1px solid var(--border-strong);border-radius:8px;padding:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;max-height:280px;overflow-y:auto;}
.ai-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

/* ===== Modals ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:14px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.5);}
.modal-head{padding:18px 20px 6px;display:flex;align-items:center;gap:10px;}
.modal-head h3{margin:0;font-family:var(--font-display);font-size:17px;flex:1;}
.modal-body{padding:14px 20px 20px;display:flex;flex-direction:column;gap:12px;}
.modal-body label{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);}
.modal-body input,.modal-body select{width:100%;background:var(--bg-panel-raised);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);padding:10px 12px;font-size:14px;}
.mtabs{display:flex;gap:4px;padding:0 20px;}
.mtab{flex:1;padding:8px;text-align:center;border-radius:7px;border:1px solid var(--border-strong);background:transparent;color:var(--text-dim);font-size:12.5px;}
.mtab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.license-status{background:var(--bg-panel-raised);border:1px solid var(--border-strong);border-radius:10px;padding:12px 14px;font-size:13px;}
.license-status .row{display:flex;justify-content:space-between;padding:3px 0;color:var(--text-dim);}
.license-status .row b{color:var(--text);font-weight:600;}
.codebox{font-family:var(--font-mono);background:var(--bg-app);border:1px dashed var(--border-strong);border-radius:8px;padding:12px;text-align:center;font-size:17px;letter-spacing:2px;color:var(--brass-bright);}

.toast-stack{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:#21242b;border:1px solid var(--border-strong);color:var(--text);padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:up .18s ease;}
.toast.err{border-color:var(--danger);}
@keyframes up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.sig-canvas{background:#fff;border-radius:8px;touch-action:none;width:100%;height:160px;}

@media(max-width:820px){
  .sidebar{position:fixed;top:53px;bottom:0;left:0;z-index:50;box-shadow:8px 0 24px rgba(0,0,0,.4);}
  .sidebar:not(.collapsed){margin-left:0;}
  .sidebar.collapsed{margin-left:-230px;}
  .paper-scroll{padding:18px 10px 100px;}
  .paper-body,.paper-header,.paper-footer{padding-left:22px;padding-right:22px;}
  .brand span.label{display:none;}
}

/* ===== Tableur ===== */
.sheet-wrap{flex:1;min-width:0;display:none;flex-direction:column;background:#0F1116;overflow:hidden;}
.sheet-wrap.active{display:flex;}
.editor-wrap.hidden{display:none;}

.formula-bar{
  display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg-panel);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.cell-ref{
  font-family:var(--font-mono);font-size:12.5px;color:var(--brass-bright);
  background:var(--bg-panel-raised);border:1px solid var(--border-strong);border-radius:6px;
  padding:6px 10px;min-width:52px;text-align:center;flex-shrink:0;
}
.formula-input{
  flex:1;background:var(--bg-panel-raised);border:1px solid var(--border-strong);border-radius:6px;
  color:var(--text);padding:6px 10px;font-family:var(--font-mono);font-size:13px;
}
.sheet-toolbar{display:flex;align-items:center;gap:3px;flex-wrap:wrap;padding:6px 14px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0;}
.fmt-select{background:var(--bg-panel-raised);color:var(--text);border:1px solid var(--border-strong);border-radius:6px;padding:6px 8px;font-size:12px;}

.grid-scroll{flex:1;overflow:auto;background:#0F1116;}
table.grid{border-collapse:collapse;table-layout:fixed;}
table.grid th{
  position:sticky;top:0;background:var(--bg-panel);color:var(--text-faint);font-weight:500;
  font-size:11.5px;border:1px solid var(--border);padding:5px 4px;text-align:center;z-index:5;min-width:92px;
}
table.grid th.rowhead{position:sticky;left:0;top:auto;z-index:6;min-width:38px;width:38px;background:var(--bg-panel);}
table.grid th.corner{position:sticky;left:0;top:0;z-index:7;}
table.grid td.rownum{
  position:sticky;left:0;background:var(--bg-panel);color:var(--text-faint);font-size:11px;text-align:center;
  border:1px solid var(--border);z-index:4;user-select:none;
}
table.grid td{border:1px solid var(--border);padding:0;}
table.grid input.cell-input{
  width:100%;box-sizing:border-box;background:#171a20;color:var(--text);border:none;outline:none;
  padding:6px 8px;font-size:12.5px;font-family:var(--font-body);
}
table.grid input.cell-input:focus{background:#20262f;box-shadow:inset 0 0 0 2px var(--ink);}
table.grid input.cell-input.num{text-align:right;}
table.grid input.cell-input.err{color:var(--danger);}
table.grid input.cell-input.hdr{font-weight:600;background:#1b2b27;}
table.grid input.cell-input.b{font-weight:700;}
table.grid input.cell-input.it{font-style:italic;}
table.grid input.cell-input.un{text-decoration:underline;}
table.grid input.cell-input.al-l{text-align:left;}
table.grid input.cell-input.al-c{text-align:center;}
table.grid input.cell-input.al-r{text-align:right;}
.sheet-toolbar input[type=color].swatch{width:26px;height:26px;padding:2px;}

.sheet-tabs-bar{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bg-panel);border-top:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.sheet-add-row-col{display:flex;gap:6px;padding:8px 14px;background:var(--bg-panel);border-top:1px solid var(--border);flex-shrink:0;}

.charts-panel{display:flex;flex-wrap:wrap;gap:14px;padding:14px;border-top:1px solid var(--border);background:#0F1116;max-height:38vh;overflow-y:auto;}
.charts-panel:empty{display:none;}
.chart-card{background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:10px;padding:10px;width:290px;flex-shrink:0;}
.chart-card .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.chart-card .chead b{font-size:12.5px;}
.chart-card .chead button{background:transparent;border:none;color:var(--text-faint);cursor:pointer;}
.chart-card canvas{width:100%;height:170px;}

.ai-issue{background:var(--bg-panel-raised);border:1px solid var(--border-strong);border-left:3px solid var(--danger);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-bottom:6px;cursor:pointer;}
.ai-issue b{font-family:var(--font-mono);color:var(--brass-bright);}

/* ===== Slides module ===== */
.slides-wrap{display:none;flex:1;min-height:0;flex-direction:column;background:#0F1116;}
.slides-wrap.active{display:flex;}
.slides-toolbar{display:flex;align-items:center;gap:3px;flex-wrap:wrap;padding:8px 14px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0;}
.slides-toolbar select{background:var(--bg-panel-raised);color:var(--text);border:1px solid var(--border-strong);border-radius:6px;padding:6px 8px;font-size:12.5px;}
.slides-body{flex:1;display:flex;min-height:0;}
.filmstrip{width:150px;flex-shrink:0;background:var(--bg-panel);border-right:1px solid var(--border);overflow-y:auto;padding:10px 8px;}
.film-slide{
  border:2px solid var(--border-strong);border-radius:8px;margin-bottom:10px;cursor:pointer;overflow:hidden;
  aspect-ratio:16/9;position:relative;background:#1c2027;
}
.film-slide.active{border-color:var(--ink-bright);}
.film-slide .fnum{position:absolute;top:3px;left:5px;font-family:var(--font-mono);font-size:9px;color:var(--text-faint);z-index:2;}
.film-slide .fpreview{position:absolute;inset:0;transform:scale(1);transform-origin:top left;pointer-events:none;}
.film-add{border:1.5px dashed var(--border-strong);border-radius:8px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer;}
.film-add:hover{border-color:var(--ink-bright);color:var(--ink-bright);}

.canvas-scroll{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:30px;}
.slide-canvas{
  width:860px;max-width:100%;aspect-ratio:16/9;border-radius:6px;box-shadow:0 20px 50px var(--paper-shadow);
  position:relative;overflow:hidden;flex-shrink:0;display:flex;flex-direction:column;
}
/* Themes */
.slide-canvas.theme-ardoise{background:linear-gradient(160deg,#171a20,#0F1116);color:#EDEAE1;}
.slide-canvas.theme-ardoise .s-title{color:#EDEAE1;}
.slide-canvas.theme-ardoise .s-accent{background:var(--ink);}
.slide-canvas.theme-clair{background:#F7F5EE;color:#20221F;}
.slide-canvas.theme-clair .s-title{color:#171a20;}
.slide-canvas.theme-clair .s-accent{background:var(--brass);}
.slide-canvas.theme-brass{background:linear-gradient(160deg,#1f1a12,#14120c);color:#F3E9D6;}
.slide-canvas.theme-brass .s-title{color:#EFCE93;}
.slide-canvas.theme-brass .s-accent{background:var(--brass-bright);}

.s-accent{position:absolute;top:0;left:0;bottom:0;width:8px;}
.s-inner{flex:1;display:flex;flex-direction:column;justify-content:center;padding:56px 64px;min-height:0;}
.s-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;opacity:.55;text-transform:uppercase;margin-bottom:10px;outline:none;}
.s-title{font-family:var(--font-display);font-weight:600;font-size:38px;line-height:1.15;outline:none;margin:0 0 14px;}
.slide-canvas.layout-title .s-title{font-size:46px;}
.s-subtitle{font-size:17px;opacity:.75;outline:none;max-width:80%;}
.s-body{font-size:18px;line-height:1.55;outline:none;max-width:88%;}
.s-body ul{margin:0;padding-left:22px;}
.s-body li{margin-bottom:8px;}
.s-image-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 60px 50px;min-height:0;}
.s-image-wrap img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.3);}
.s-image-wrap.empty{border:2px dashed rgba(255,255,255,0.2);border-radius:8px;color:inherit;opacity:.5;cursor:pointer;font-size:13px;}

.canvas-foot{display:flex;justify-content:center;gap:8px;padding:8px;flex-shrink:0;}

/* Présentation plein écran */
.present-overlay{position:fixed;inset:0;background:#0a0b0d;z-index:200;display:none;flex-direction:column;}
.present-overlay.open{display:flex;}
.present-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:26px;min-height:0;}
.present-stage .slide-canvas{width:min(1100px,92vw);box-shadow:none;transition:opacity .25s;}
.present-bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px;background:#111318;flex-shrink:0;}
.present-bar button{background:transparent;border:1px solid var(--border-strong);color:var(--text);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;}
.present-bar button:hover{background:var(--bg-panel-raised);}
.present-dots{display:flex;gap:5px;}
.present-dots span{width:6px;height:6px;border-radius:50%;background:var(--text-faint);}
.present-dots span.active{background:var(--ink-bright);}
.present-counter{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);}

/* ===== Module Calcul ===== */
.calc-wrap{display:none;flex:1;min-height:0;flex-direction:column;background:#0F1116;overflow-y:auto;}
.calc-wrap.active{display:flex;}
.calc-tabs{display:flex;gap:4px;padding:10px 14px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.calc-tab{padding:7px 13px;border-radius:7px;border:1px solid var(--border-strong);background:transparent;color:var(--text-dim);font-size:12.5px;}
.calc-tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.calc-body{flex:1;padding:20px;max-width:640px;margin:0 auto;width:100%;}
.calc-body h4{font-family:var(--font-display);font-size:15px;margin:0 0 12px;color:var(--text);}
.calc-row{display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap;}
.calc-row label{font-size:12px;color:var(--text-faint);min-width:90px;}
.calc-row input,.calc-row select{background:var(--bg-panel-raised);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);padding:9px 11px;font-size:14px;flex:1;min-width:90px;}
.calc-display{background:var(--bg-panel-raised);border:1px solid var(--border-strong);border-radius:10px;padding:16px;margin-bottom:12px;text-align:right;}
.calc-display .expr{font-family:var(--font-mono);font-size:13px;color:var(--text-faint);min-height:16px;word-break:break-all;}
.calc-display .val{font-family:var(--font-mono);font-size:28px;color:var(--text);margin-top:4px;word-break:break-all;}
.calc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px;}
.calc-btn{padding:13px 0;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-panel-raised);color:var(--text);font-size:14px;font-family:var(--font-mono);}
.calc-btn:hover{border-color:var(--text-dim);}
.calc-btn.op{color:var(--brass-bright);}
.calc-btn.eq{background:var(--ink);border-color:var(--ink);color:#fff;grid-column:span 2;}
.calc-btn.fn{font-size:11.5px;}
.calc-btn.active-mode{background:var(--ink);border-color:var(--ink);color:#fff;}
.calc-hist{font-size:11.5px;color:var(--text-faint);max-height:90px;overflow-y:auto;margin-bottom:10px;}
.calc-hist div{padding:3px 0;cursor:pointer;border-bottom:1px solid var(--border);}
.calc-hist div:hover{color:var(--text);}
.calc-result{background:var(--bg-panel-raised);border:1px solid var(--border-strong);border-radius:10px;padding:14px;font-size:14px;line-height:1.6;margin-top:6px;}
.calc-result b{color:var(--brass-bright);}
.matrix-grid{display:inline-grid;gap:6px;margin-bottom:10px;}
.matrix-grid input{width:56px;text-align:center;background:var(--bg-panel-raised);border:1px solid var(--border-strong);border-radius:6px;color:var(--text);padding:8px 4px;font-family:var(--font-mono);}
.matrix-pair{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px;}
.matrix-block b{display:block;margin-bottom:6px;font-size:12px;color:var(--text-faint);}

/* ===== Print ===== */
@media print{
  body *{visibility:hidden;}
  .paper-scroll,.paper-scroll *{visibility:visible;}
  .paper-scroll{position:absolute;left:0;top:0;padding:0;overflow:visible;}
  .paper{box-shadow:none;max-width:100%;}
  .paper-header,.paper-footer{border:none;}

  body.print-sheet .paper-scroll{display:none;}
  body.print-sheet .grid-scroll,body.print-sheet .grid-scroll *{visibility:visible;}
  body.print-sheet .grid-scroll{position:absolute;left:0;top:0;overflow:visible;background:#fff;}
  body.print-sheet table.grid{background:#fff;}
  body.print-sheet table.grid input.cell-input{background:#fff;color:#111;}
  body.print-sheet table.grid th,body.print-sheet table.grid td.rownum{background:#eee;color:#333;}

  body.print-slides #printSlidesContainer{display:block !important;visibility:visible;position:absolute;left:0;top:0;width:100%;}
  body.print-slides #printSlidesContainer *{visibility:visible;}
  body.print-slides #printSlidesContainer .slide-canvas{width:100%;aspect-ratio:16/9;box-shadow:none;border-radius:0;page-break-after:always;}
}
#printSlidesContainer{display:none;}
</style>

<script>
(function(){
"use strict";

/* ============================================================
   ÉTAT & PERSISTANCE — deepMergeDefaults pattern
   ============================================================ */
const DB_KEY = 'officeai_pro_v1';
const DEFAULTS = {
  version: 3,
  documents: [],
  activeDocId: null,
  sheetDocuments: [],
  activeSheetId: null,
  slideDecks: [],
  activeDeckId: null,
  license: {
    tier: 'free',        // free | premium
    code: null,
    activatedAt: null,
    expiresAt: null,      // null = permanent
    lastSeenTs: 0
  },
  settings: {
    apiKey: '',
    model: 'claude-sonnet-5',
    aiCallsToday: 0,
    aiCallsDate: ''
  }
};

function deepMergeDefaults(target, defaults) {
  if (typeof defaults !== 'object' || defaults === null) return target === undefined ? defaults : target;
  const out = Array.isArray(defaults) ? (Array.isArray(target) ? target.slice() : defaults.slice()) : Object.assign({}, defaults);
  if (typeof target === 'object' && target !== null && !Array.isArray(defaults)) {
    for (const k in defaults) out[k] = deepMergeDefaults(target[k], defaults[k]);
    for (const k in target) if (!(k in out)) out[k] = target[k];
  }
  return out;
}

function loadDB(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(DB_KEY)); } catch(e){}
  return deepMergeDefaults(raw || {}, DEFAULTS);
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

let DB = loadDB();

/* ============================================================
   UTILITAIRES
   ============================================================ */
function uid(){ return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }
function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.getElementById('toastStack').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.25s'; setTimeout(()=>el.remove(),250); }, 2600);
}
function escHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   LICENCE / FREEMIUM
   Codes: PREFIXE-XXXXXXXX (8 car. hex dérivés d'un HMAC simple local)
   BLESS = 30 jours | OMARO = 90 jours | NAMKE = 365 jours | NAMKE-PERM = permanent
   Anti-recul d'horloge : on refuse toute date système < dernière date vue.
   ============================================================ */
const LICENSE_SECRET = 'OfficeAIPro-Bertrand-2026'; // secret local partagé entre génération/validation
const TIER_DAYS = { BLESS: 30, OMARO: 90, NAMKE: 365 };

async function simpleHash(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function generateCode(prefix, dayBucket, perm){
  // dayBucket ancre le code à une fenêtre de temps (jour) pour permettre l'expiration des codes SMS
  const payload = LICENSE_SECRET + '|' + prefix + '|' + dayBucket + '|' + (perm?'PERM':'');
  const h = await simpleHash(payload);
  return prefix + (perm ? '-PERM' : '') + '-' + h.slice(0,8).toUpperCase();
}

async function validateAndActivate(rawCode){
  const code = (rawCode||'').trim().toUpperCase();
  const m = code.match(/^(BLESS|OMARO|NAMKE)(-PERM)?-([A-F0-9]{8})$/);
  if (!m) return { ok:false, msg:"Format de code invalide." };
  const prefix = m[1], perm = !!m[2], sig = m[3];
  const today = Math.floor(Date.now() / 86400000);
  // on tolère la fenêtre du jour courant et de la veille (le temps que le SMS arrive)
  for (const bucket of [today, today-1]) {
    const expected = await generateCode(prefix, bucket, perm);
    if (expected.endsWith(sig)) {
      const days = perm ? null : TIER_DAYS[prefix];
      DB.license.tier = 'premium';
      DB.license.code = code;
      DB.license.activatedAt = nowISO();
      DB.license.expiresAt = days ? new Date(Date.now() + days*86400000).toISOString() : null;
      DB.license.lastSeenTs = Date.now();
      saveDB();
      return { ok:true, msg: perm ? "Licence permanente activée." : `Licence activée pour ${days} jours.` };
    }
  }
  return { ok:false, msg:"Code invalide ou expiré." };
}

function checkLicenseValidity(){
  const lic = DB.license;
  const now = Date.now();
  // anti-recul d'horloge
  if (now < lic.lastSeenTs) {
    toast("Horloge système suspecte — licence repassée en gratuit par sécurité.", true);
    lic.tier = 'free'; lic.expiresAt = null; saveDB();
    return;
  }
  lic.lastSeenTs = Math.max(lic.lastSeenTs, now); saveDB();
  if (lic.tier === 'premium' && lic.expiresAt && new Date(lic.expiresAt).getTime() < now) {
    lic.tier = 'free';
    saveDB();
    toast("Votre licence Premium a expiré.");
  }
}

function isPremium(){ return DB.license.tier === 'premium'; }
const FREE_LIMITS = { maxDocs: 2, maxSheets: 2, maxDecks: 2, maxAiCallsPerDay: 5 };

function aiCallsRemainingToday(){
  const today = new Date().toISOString().slice(0,10);
  if (DB.settings.aiCallsDate !== today) { DB.settings.aiCallsDate = today; DB.settings.aiCallsToday = 0; saveDB(); }
  return FREE_LIMITS.maxAiCallsPerDay - DB.settings.aiCallsToday;
}
function registerAiCall(){
  const today = new Date().toISOString().slice(0,10);
  if (DB.settings.aiCallsDate !== today) { DB.settings.aiCallsDate = today; DB.settings.aiCallsToday = 0; }
  DB.settings.aiCallsToday++; saveDB();
}

function renderTierBadge(){
  const b = document.getElementById('tierBadge');
  if (isPremium()){ b.textContent = 'Premium'; b.classList.add('premium'); }
  else { b.textContent = 'Gratuit'; b.classList.remove('premium'); }
}

/* 10 clics sur le titre → panneau admin caché */
let clickCount = 0, clickTimer = null;
document.getElementById('brandTitle').addEventListener('click', ()=>{
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(()=>{ clickCount = 0; }, 800);
  if (clickCount >= 10){ clickCount = 0; openAdmin(); }
});

/* ============================================================
   ADMIN MODAL
   ============================================================ */
const adminOverlay = document.getElementById('adminOverlay');
const adminBody = document.getElementById('adminBody');
let adminTab = 'licence';

function openAdmin(){
  // Accès complet : réservé au triple-clic sur le titre (voir plus haut).
  adminTab = 'licence';
  document.getElementById('adminMtabs').style.display = '';
  document.getElementById('adminModalTitle').textContent = 'Administration';
  document.querySelectorAll('.mtab').forEach(x=>x.classList.toggle('active', x.dataset.atab==='licence'));
  adminOverlay.classList.add('open');
  renderAdmin();
}
function openLicense(){
  // Accès client : uniquement le champ de code d'activation, jamais le générateur.
  adminTab = 'licence';
  document.getElementById('adminMtabs').style.display = 'none';
  document.getElementById('adminModalTitle').textContent = 'Licence';
  adminOverlay.classList.add('open');
  renderAdmin();
}
document.getElementById('closeAdmin').onclick = ()=> adminOverlay.classList.remove('open');
adminOverlay.addEventListener('click', e=>{ if(e.target===adminOverlay) adminOverlay.classList.remove('open'); });
document.querySelectorAll('.mtab').forEach(b=>{
  b.onclick = ()=>{ adminTab = b.dataset.atab; document.querySelectorAll('.mtab').forEach(x=>x.classList.toggle('active', x===b)); renderAdmin(); };
});

function renderAdmin(){
  if (adminTab === 'licence'){
    const lic = DB.license;
    adminBody.innerHTML = `
      <div class="license-status">
        <div class="row"><span>Statut</span><b>${isPremium()?'Premium':'Gratuit'}</b></div>
        ${lic.code ? `<div class="row"><span>Code actif</span><b>${escHtml(lic.code)}</b></div>` : ''}
        ${lic.expiresAt ? `<div class="row"><span>Expire le</span><b>${new Date(lic.expiresAt).toLocaleDateString('fr-FR')}</b></div>` : (isPremium() ? `<div class="row"><span>Durée</span><b>Permanente</b></div>` : '')}
        ${!isPremium() ? `<div class="row"><span>Documents texte</span><b>${DB.documents.length} / ${FREE_LIMITS.maxDocs}</b></div>` : ''}
        ${!isPremium() ? `<div class="row"><span>Feuilles de calcul</span><b>${DB.sheetDocuments.length} / ${FREE_LIMITS.maxSheets}</b></div>` : ''}
        ${!isPremium() ? `<div class="row"><span>Présentations</span><b>${DB.slideDecks.length} / ${FREE_LIMITS.maxDecks}</b></div>` : ''}
        ${!isPremium() ? `<div class="row"><span>Appels IA / jour</span><b>${DB.settings.aiCallsToday} / ${FREE_LIMITS.maxAiCallsPerDay}</b></div>` : ''}
      </div>
      <label>Code d'activation</label>
      <input type="text" id="codeInput" placeholder="EX: NAMKE-A1B2C3D4" style="font-family:var(--font-mono);text-transform:uppercase;">
      <button class="btn primary" id="activateBtn">Activer le code</button>
      <div class="ai-hint">Préfixes : BLESS (30 j) · OMARO (90 j) · NAMKE (365 j / permanent).</div>
    `;
    document.getElementById('activateBtn').onclick = async ()=>{
      const v = document.getElementById('codeInput').value;
      const r = await validateAndActivate(v);
      toast(r.msg, !r.ok);
      if (r.ok){ renderTierBadge(); renderAdmin(); renderSidebar(); }
    };
  } else {
    adminBody.innerHTML = `
      <div class="ai-hint">Générateur réservé à l'administrateur — pour toi, Bertrand. Crée un code à transmettre par SMS (valable ~48h glissantes).</div>
      <label>Type de licence</label>
      <select id="genPrefix">
        <option value="BLESS">BLESS — 30 jours</option>
        <option value="OMARO">OMARO — 90 jours</option>
        <option value="NAMKE">NAMKE — 365 jours</option>
        <option value="NAMKE_PERM">NAMKE — Permanent</option>
      </select>
      <button class="btn primary" id="genBtn">Générer le code</button>
      <div id="genResult"></div>
    `;
    document.getElementById('genBtn').onclick = async ()=>{
      const v = document.getElementById('genPrefix').value;
      const perm = v === 'NAMKE_PERM';
      const prefix = perm ? 'NAMKE' : v;
      const today = Math.floor(Date.now()/86400000);
      const code = await generateCode(prefix, today, perm);
      document.getElementById('genResult').innerHTML = `<div class="codebox">${code}</div><div class="ai-hint" style="margin-top:8px;">À envoyer par SMS. Le code reste valable aujourd'hui et demain (fenêtre glissante de 48h).</div>`;
    };
  }
}

/* ============================================================
   GESTION DES DOCUMENTS
   ============================================================ */
const pageHeader = document.getElementById('pageHeader');
const pageBody = document.getElementById('pageBody');
const pageFooter = document.getElementById('pageFooter');

function currentDoc(){ return DB.documents.find(d=>d.id===DB.activeDocId); }

function newDocument(silent){
  if (!isPremium() && DB.documents.length >= FREE_LIMITS.maxDocs){
    toast(`Limite gratuite atteinte (${FREE_LIMITS.maxDocs} documents). Passez à Premium pour continuer.`, true);
    openLicense();
    return;
  }
  const doc = { id: uid(), title: 'Sans titre', header:'', body:'', footer:'Office Songda', createdAt: nowISO(), updatedAt: nowISO() };
  DB.documents.unshift(doc);
  DB.activeDocId = doc.id;
  saveDB();
  renderDocList();
  loadActiveDoc();
  if(!silent) toast('Nouveau document créé.');
}

function loadActiveDoc(){
  const doc = currentDoc();
  if (!doc){ pageHeader.innerHTML=''; pageBody.innerHTML=''; pageFooter.textContent='Office Songda'; return; }
  pageHeader.innerHTML = doc.header || '';
  pageBody.innerHTML = doc.body || '';
  pageFooter.textContent = doc.footer || 'Office Songda';
}

let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    const doc = currentDoc();
    if (!doc) return;
    doc.header = pageHeader.innerHTML;
    doc.body = pageBody.innerHTML;
    doc.footer = pageFooter.textContent;
    // titre auto = premier texte du corps
    const txt = pageBody.textContent.trim();
    doc.title = txt ? txt.slice(0,40) : 'Sans titre';
    doc.updatedAt = nowISO();
    saveDB();
    renderDocList();
  }, 500);
}
[pageHeader, pageBody, pageFooter].forEach(el=>{
  el.addEventListener('input', scheduleSave);
});

function renderDocList(){
  const list = document.getElementById('docList');
  if (!DB.documents.length){
    list.innerHTML = `<div style="padding:16px 10px;color:var(--text-faint);font-size:12.5px;">Aucun document. Cliquez sur + pour commencer.</div>`;
    return;
  }
  list.innerHTML = DB.documents.map(d=>`
    <div class="doc-item ${d.id===DB.activeDocId?'active':''}" data-id="${d.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>
      <span>${escHtml(d.title)}</span>
      <svg class="del" data-id="${d.id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>
    </div>
  `).join('');
  list.querySelectorAll('.doc-item').forEach(it=>{
    it.addEventListener('click', (e)=>{
      if (e.target.closest('.del')) return;
      DB.activeDocId = it.dataset.id; saveDB(); renderDocList(); loadActiveDoc();
    });
  });
  list.querySelectorAll('.del').forEach(d=>{
    d.addEventListener('click', (e)=>{
      e.stopPropagation();
      if (!confirm('Supprimer ce document ?')) return;
      DB.documents = DB.documents.filter(x=>x.id!==d.dataset.id);
      if (DB.activeDocId === d.dataset.id) DB.activeDocId = DB.documents[0]?.id || null;
      saveDB(); renderDocList(); loadActiveDoc();
    });
  });
}

function renderSidebar(){
  if (currentModule === 'sheet') renderSheetList();
  else if (currentModule === 'slides') renderDeckList();
  else if (currentModule === 'calc') { document.getElementById('docList').innerHTML = `<div style="padding:16px 10px;color:var(--text-faint);font-size:12.5px;">Outil de calcul — sans document. Vos calculs ne sont pas sauvegardés.</div>`; }
  else renderDocList();
}

document.getElementById('newDocBtn').onclick = ()=>{
  if (currentModule === 'sheet') newSheet();
  else if (currentModule === 'slides') newDeck();
  else if (currentModule === 'calc') { /* pas d'action : outil sans document */ }
  else newDocument();
};
document.getElementById('toggleSidebar').onclick = ()=> document.getElementById('sidebar').classList.toggle('collapsed');

/* ============================================================
   BASCULE ENTRE MODULES (Texte / Tableur / Slides)
   ============================================================ */
let currentModule = 'doc';
function switchModule(mod){
  if (mod === currentModule) return;
  currentModule = mod;
  document.querySelectorAll('.module-tab[data-mod]').forEach(t=> t.classList.toggle('active', t.dataset.mod===mod));
  document.querySelector('.editor-wrap').classList.toggle('hidden', mod!=='doc');
  document.getElementById('sheetWrap').classList.toggle('active', mod==='sheet');
  document.getElementById('slidesWrap').classList.toggle('active', mod==='slides');
  document.getElementById('calcWrap').classList.toggle('active', mod==='calc');
  const labels = { doc:'Mes documents', sheet:'Mes feuilles de calcul', slides:'Mes présentations', calc:'Calcul avancé' };
  document.getElementById('sidebarLabel').textContent = labels[mod];
  document.getElementById('toolbar').style.display = mod==='doc' ? 'flex' : 'none';
  document.getElementById('sidebar').classList.toggle('collapsed', mod==='calc' || document.getElementById('sidebar').classList.contains('collapsed'));
  document.getElementById('exportBtn').style.display = mod==='calc' ? 'none' : 'inline-flex';
  document.getElementById('newDocBtn').style.display = mod==='calc' ? 'none' : 'flex';
  renderSidebar();
  if (mod === 'sheet'){
    if (!DB.sheetDocuments.length) newSheet(true);
    loadActiveSheet();
  }
  if (mod === 'slides'){
    if (!DB.slideDecks.length) newDeck(true);
    loadActiveDeck();
  }
  if (mod === 'calc'){
    renderCalcBody();
  }
}
document.querySelectorAll('.module-tab[data-mod]').forEach(t=>{
  t.addEventListener('click', ()=> switchModule(t.dataset.mod));
});

function selectElemForAlign(el){
  if (selectedElem) selectedElem.classList.remove('elem-selected');
  selectedElem = el;
  selectedElem.classList.add('elem-selected');

  // Positionne la barre juste au-dessus de l'élément sélectionné (coordonnées viewport, position:fixed)

// Déplace l'élément (image/tableau) vers le haut ou le bas dans le document, bloc par bloc
function moveElem(el, dir){
  let node = el;
  // Si l'élément est seul dans un <p> (cas fréquent pour une image insérée au milieu du texte), on déplace le paragraphe entier
  const parent = node.parentElement;
  if (parent && parent !== pageBody && parent.tagName === 'P' && parent.textContent.trim() === '' && parent.children.length === 1){
    node = parent;
  }
  const container = node.parentElement;
  if (!container) return;
  if (dir === -1){
    const prev = node.previousElementSibling;
    if (prev) container.insertBefore(node, prev);
  } else {
    const next = node.nextElementSibling;
    if (next) container.insertBefore(next, node);
  }
  scheduleSave();
  requestAnimationFrame(()=> selectElemForAlign(el));
}

elemAlignBar.querySelectorAll('button[data-move]').forEach(btn=>{
  btn.addEventListener('click', (e)=>{
    e.preventDefault();
    if (!selectedElem) return;
    moveElem(selectedElem, parseInt(btn.dataset.move, 10));
  });
});

function colLetter(i){ // 0-based -> A, B, ... Z, AA...
  let s = '';
  i++;
  while (i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); }
  return s;
}
function refToRC(ref){
  const m = ref.toUpperCase().match(/^([A-Z]+)(\d+)$/);
  if (!m) return null;
  let col = 0; for (const ch of m[1]) col = col*26 + (ch.charCodeAt(0)-64);
  return { r: parseInt(m[2],10)-1, c: col-1 };
}

/* ---------- Moteur de formules ---------- */
// Tokenizer
function tokenize(src){
  const toks = []; let i=0;
  while (i<src.length){
    const ch = src[i];
    if (/\s/.test(ch)){ i++; continue; }
    if (/[0-9]/.test(ch) || (ch==='.' && /[0-9]/.test(src[i+1]))){
      let j=i; while (j<src.length && /[0-9.]/.test(src[j])) j++;
      toks.push({t:'num', v:parseFloat(src.slice(i,j))}); i=j; continue;
    }
    if (ch === '"'){
      let j=i+1; while (j<src.length && src[j] !== '"') j++;
      toks.push({t:'str', v:src.slice(i+1,j)}); i=j+1; continue;
    }
    if (/[A-Za-z]/.test(ch)){
      let j=i; while (j<src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
      const word = src.slice(i,j);
      toks.push({t:/^[A-Za-z]+[0-9]+$/.test(word) ? 'ref' : 'ident', v:word.toUpperCase()});
      i=j; continue;
    }
    if ('+-*/^(),:&'.includes(ch)){ toks.push({t:ch}); i++; continue; }
    if (ch==='=' && src[i+1]==='='){ toks.push({t:'=='}); i+=2; continue; }
    if (ch==='<' && src[i+1]==='='){ toks.push({t:'<='}); i+=2; continue; }
    if (ch==='>' && src[i+1]==='='){ toks.push({t:'>='}); i+=2; continue; }
    if (ch==='<' && src[i+1]==='>'){ toks.push({t:'<>'}); i+=2; continue; }
    if ('<>='.includes(ch)){ toks.push({t:ch}); i++; continue; }
    throw new Error('Caractère inattendu: '+ch);
  }
  return toks;
}
// Recursive-descent parser -> AST
function parseFormula(src){
  const toks = tokenize(src); let p = 0;
  function peek(){ return toks[p]; }
  function next(){ return toks[p++]; }
  function expect(t){ if (!peek() || peek().t!==t) throw new Error('Erreur de syntaxe près de '+(peek()?peek().t:'fin')); return next(); }

  function parseExpr(){ return parseCompare(); }
  function parseCompare(){
    let left = parseConcat();
    while (peek() && ['=','==','<>','<','>','<=','>='].includes(peek().t)){
      const op = next().t; const right = parseConcat();
      left = { type:'bin', op: op==='='?'==':op, left, right };
    }
    return left;
  }
  function parseConcat(){
    let left = parseAdd();
    while (peek() && peek().t==='&'){ next(); const right=parseAdd(); left={type:'concat',left,right}; }
    return left;
  }
  function parseAdd(){
    let left = parseMul();
    while (peek() && (peek().t==='+'||peek().t==='-')){ const op=next().t; const right=parseMul(); left={type:'bin',op,left,right}; }
    return left;
  }
  function parseMul(){
    let left = parsePow();
    while (peek() && (peek().t==='*'||peek().t==='/')){ const op=next().t; const right=parsePow(); left={type:'bin',op,left,right}; }
    return left;
  }
  function parsePow(){
    let left = parseUnary();
    while (peek() && peek().t==='^'){ next(); const right=parseUnary(); left={type:'bin',op:'^',left,right}; }
    return left;
  }
  function parseUnary(){
    if (peek() && peek().t==='-'){ next(); return { type:'neg', expr: parseUnary() }; }
    return parseAtom();
  }
  function parseAtom(){
    const tk = peek();
    if (!tk) throw new Error('Formule incomplète');
    if (tk.t==='num'){ next(); return {type:'num', v:tk.v}; }
    if (tk.t==='str'){ next(); return {type:'str', v:tk.v}; }
    if (tk.t==='('){ next(); const e=parseExpr(); expect(')'); return e; }
    if (tk.t==='ref'){
      next();
      if (peek() && peek().t===':'){ next(); const end = expect('ref'); return { type:'range', from:tk.v, to:end.v }; }
      return { type:'ref', v: tk.v };
    }
    if (tk.t==='ident'){
      next();
      expect('(');
      const args = [];
      if (peek() && peek().t!==')'){
        args.push(parseExpr());
        while (peek() && peek().t===','){ next(); args.push(parseExpr()); }
      }
      expect(')');
      return { type:'call', name:tk.v, args };
    }
    throw new Error('Jeton inattendu');
  }
  const ast = parseExpr();
  if (p !== toks.length) throw new Error('Formule invalide');
  return ast;
}

const FUNCS = {
  SUM: a => flat(a).reduce((s,v)=>s+(num(v)||0),0),
  AVERAGE: a => { const f=flat(a).map(num).filter(v=>v!=null); return f.length? f.reduce((s,v)=>s+v,0)/f.length : 0; },
  MIN: a => Math.min(...flat(a).map(num).filter(v=>v!=null)),
  MAX: a => Math.max(...flat(a).map(num).filter(v=>v!=null)),
  COUNT: a => flat(a).filter(v=>typeof v==='number' || (typeof v==='string' && v!=='' && !isNaN(v))).length,
  COUNTA: a => flat(a).filter(v=>v!==''&&v!=null).length,
  COUNTBLANK: a => flat(a).filter(v=>v===''||v==null).length,
  COUNTIF: (a,crit) => flat([a]).filter(v=>matchCriteria(v, crit)).length,
  SUMIF: (a,crit,sumRange) => { const av=flat([a]); const sv = sumRange? flat([sumRange]) : av; let s=0; av.forEach((v,i)=>{ if(matchCriteria(v,crit)) s+= num(sv[i])||0; }); return s; },
  AVERAGEIF: (a,crit,avgRange) => { const av=flat([a]); const sv = avgRange? flat([avgRange]) : av; let s=0,n=0; av.forEach((v,i)=>{ if(matchCriteria(v,crit)){ s+= num(sv[i])||0; n++; } }); return n? s/n : 0; },
  ROUND: (v,d) => { const dec = d==null?0:num(d); return Math.round(num(v)*Math.pow(10,dec))/Math.pow(10,dec); },
  ROUNDUP: (v,d) => { const dec=d==null?0:num(d); return Math.ceil(num(v)*Math.pow(10,dec))/Math.pow(10,dec); },
  ROUNDDOWN: (v,d) => { const dec=d==null?0:num(d); return Math.floor(num(v)*Math.pow(10,dec))/Math.pow(10,dec); },
  ABS: v => Math.abs(num(v)),
  SQRT: v => Math.sqrt(num(v)),
  POWER: (a,b) => Math.pow(num(a),num(b)),
  MOD: (a,b) => num(a) % num(b),
  INT: v => Math.floor(num(v)),
  TRUNC: v => Math.trunc(num(v)),
  PRODUCT: a => flat(a).reduce((s,v)=>s*(num(v)||1),1),
  MEDIAN: a => { const f=flat(a).map(num).filter(v=>v!=null).sort((x,y)=>x-y); if(!f.length) return 0; const m=Math.floor(f.length/2); return f.length%2? f[m] : (f[m-1]+f[m])/2; },
  STDEV: a => { const f=flat(a).map(num).filter(v=>v!=null); if(f.length<2) return 0; const m=f.reduce((s,v)=>s+v,0)/f.length; return Math.sqrt(f.reduce((s,v)=>s+(v-m)**2,0)/(f.length-1)); },
  VAR: a => { const f=flat(a).map(num).filter(v=>v!=null); if(f.length<2) return 0; const m=f.reduce((s,v)=>s+v,0)/f.length; return f.reduce((s,v)=>s+(v-m)**2,0)/(f.length-1); },
  IF: (c,t,f) => truthy(c) ? t : (f===undefined? '' : f),
  AND: (...a) => a.every(truthy),
  OR: (...a) => a.some(truthy),
  NOT: a => !truthy(a),
  IFERROR: (v,alt) => (v instanceof Error || (typeof v==='string' && v.startsWith('#'))) ? alt : v,
  VLOOKUP: (val, range, idx, exact) => {
    const rows = range2d(range);
    for (const row of rows){ if (String(row[0]) === String(val)) return row[(num(idx)||1)-1]; }
    return '#N/A';
  },
  INDEX: (range, r, c) => { const rows = range2d(range); const rr=num(r)||1; const cc=c==null?1:num(c); return (rows[rr-1]||[])[cc-1] ?? '#REF!'; },
  MATCH: (val, range) => { const f = flat([range]); const idx = f.findIndex(v=>String(v)===String(val)); return idx>=0? idx+1 : '#N/A'; },
  CHOOSE: (i,...a) => a[(num(i)||1)-1],
  CONCATENATE: (...a) => a.map(str).join(''),
  LEFT: (s,n) => str(s).slice(0, n==null?1:num(n)),
  RIGHT: (s,n) => { const ss=str(s); const nn=n==null?1:num(n); return ss.slice(Math.max(0,ss.length-nn)); },
  MID: (s,start,len) => str(s).slice((num(start)||1)-1, (num(start)||1)-1+(num(len)||0)),
  LEN: s => str(s).length,
  UPPER: s => str(s).toUpperCase(),
  LOWER: s => str(s).toLowerCase(),
  PROPER: s => str(s).replace(/\w\S*/g, t=>t[0].toUpperCase()+t.slice(1).toLowerCase()),
  TRIM: s => str(s).trim(),
  SUBSTITUTE: (s,a,b) => str(s).split(str(a)).join(str(b)),
  TEXT: (v,fmt) => num(v)!=null ? num(v).toLocaleString('fr-FR') : str(v),
  TODAY: () => new Date().toISOString().slice(0,10),
  NOW: () => new Date().toLocaleString('fr-FR'),
  DATE: (y,m,d) => `${String(num(d)).padStart(2,'0')}/${String(num(m)).padStart(2,'0')}/${num(y)}`,
  YEAR: v => new Date(str(v)).getFullYear(),
  MONTH: v => new Date(str(v)).getMonth()+1,
  DAY: v => new Date(str(v)).getDate(),
  DAYS: (a,b) => Math.round((new Date(str(a)) - new Date(str(b))) / 86400000),
  PMT: (rate,nper,pv) => { const r=num(rate),n=num(nper),p=num(pv); return r===0? -p/n : -(p*r)/(1-Math.pow(1+r,-n)); },
  FV: (rate,nper,pmt) => { const r=num(rate),n=num(nper),p=num(pmt); return r===0? -p*n : -p*((Math.pow(1+r,n)-1)/r); },
  PV: (rate,nper,pmt) => { const r=num(rate),n=num(nper),p=num(pmt); return r===0? -p*n : -p*((1-Math.pow(1+r,-n))/r); },
  NPV: (rate,...vals) => { const r=num(rate); return flat(vals).reduce((s,v,i)=> s + (num(v)||0)/Math.pow(1+r,i+1), 0); },
  TVA: (montant,taux) => num(montant) * (taux==null?0.18:num(taux)),
  RAND: () => Math.random()
};
function truthy(v){ if (typeof v==='string') return v!==''&&v!=='0'&&v.toUpperCase()!=='FAUX'; return !!v; }
function num(v){ if (v==null||v==='') return null; const n = typeof v==='number'? v : parseFloat(String(v).replace(',','.')); return isNaN(n)? null : n; }
function str(v){ return v==null? '' : String(v); }
function flat(args){ let out=[]; args.forEach(a=>{ out = out.concat(Array.isArray(a)? a : [a]); }); return out; }
function matchCriteria(v, crit){
  const c = str(crit);
  const m = c.match(/^(>=|<=|<>|>|<)?\s*(.+)$/);
  if (!m) return String(v)===c;
  const op = m[1]; const target = m[2];
  const nv = num(v), nt = num(target);
  if (op && nv!=null && nt!=null){
    if (op==='>') return nv>nt; if (op==='<') return nv<nt;
    if (op==='>=') return nv>=nt; if (op==='<=') return nv<=nt; if (op==='<>') return nv!==nt;
  }
  return String(v).toLowerCase() === target.toLowerCase();
}

let evalStack = [];
function cellRaw(sheet, ref){ return (sheet.cells[ref] ?? '').toString(); }
function evalRef(sheet, ref){
  if (evalStack.includes(ref)) return '#CIRC!';
  const raw = cellRaw(sheet, ref);
  if (!raw.startsWith('=')) { const n = num(raw); return n!=null ? n : raw; }
  evalStack.push(ref);
  try{
    const ast = parseFormula(raw.slice(1));
    const v = evalAst(sheet, ast);
    evalStack.pop();
    return v;
  }catch(e){
    evalStack.pop();
    return '#ERREUR!';
  }
}
function rangeCells(from, to){
  const a = refToRC(from), b = refToRC(to);
  const r1=Math.min(a.r,b.r), r2=Math.max(a.r,b.r), c1=Math.min(a.c,b.c), c2=Math.max(a.c,b.c);
  const out = [];
  for (let r=r1;r<=r2;r++) for (let c=c1;c<=c2;c++) out.push(colLetter(c)+(r+1));
  return out;
}
function range2d(refsOrArr){
  // Utilisé par VLOOKUP/INDEX : reconstruit une matrice ligne x colonne à partir d'une plage évaluée à plat en connaissant sa largeur
  return refsOrArr.__rows || [refsOrArr].flat().map(v=>[v]);
}
function evalAst(sheet, node){
  switch(node.type){
    case 'num': return node.v;
    case 'str': return node.v;
    case 'ref': return evalRef(sheet, node.v);
    case 'neg': return -num(evalAst(sheet,node.expr));
    case 'concat': return str(evalAst(sheet,node.left)) + str(evalAst(sheet,node.right));
    case 'range': {
      const refs = rangeCells(node.from, node.to);
      const a = refToRC(node.from), b = refToRC(node.to);
      const width = Math.abs(b.c-a.c)+1;
      const vals = refs.map(r=>evalRef(sheet,r));
      const rows = [];
      for (let i=0;i<vals.length;i+=width) rows.push(vals.slice(i,i+width));
      vals.__rows = rows;
      return vals;
    }
    case 'call': {
      const fn = FUNCS[node.name];
      if (!fn) return '#NOM?';
      const args = node.args.map(a => evalAst(sheet, a));
      return fn(...args);
    }
    case 'bin': {
      const l = evalAst(sheet,node.left), r = evalAst(sheet,node.right);
      const ln = num(l), rn = num(r);
      switch(node.op){
        case '+': return (ln||0)+(rn||0);
        case '-': return (ln||0)-(rn||0);
        case '*': return (ln||0)*(rn||0);
        case '/': return rn===0 ? '#DIV/0!' : (ln||0)/rn;
        case '^': return Math.pow(ln||0, rn||0);
        case '==': return String(l)===String(r);
        case '<>': return String(l)!==String(r);
        case '<': return (ln??l) < (rn??r);
        case '>': return (ln??l) > (rn??r);
        case '<=': return (ln??l) <= (rn??r);
        case '>=': return (ln??l) >= (rn??r);
      }
    }
  }
  return '';
}
function computeCell(sheet, ref){
  evalStack = [];
  try{ return evalRef(sheet, ref); }catch(e){ return '#ERREUR!'; }
}

function formatDisplay(sheet, ref, v){
  const fmt = sheet.formats[ref];
  if (typeof v === 'string' && v.startsWith('#')) return v;
  const n = num(v);
  if (fmt === 'currency' && n!=null) return n.toLocaleString('fr-FR',{maximumFractionDigits:0}) + ' FCFA';
  if (fmt === 'percent' && n!=null) return (n*100).toLocaleString('fr-FR',{maximumFractionDigits:1}) + ' %';
  if (fmt === 'number' && n!=null) return n.toLocaleString('fr-FR');
  return v;
}

let selectedRef = 'A1';
function renderGrid(){
  const sheet = currentSheet();
  const scroll = document.getElementById('gridScroll');
  if (!sheet){ scroll.innerHTML=''; return; }
  let html = '<table class="grid"><thead><tr><th class="corner"></th>';
  for (let c=0;c<sheet.cols;c++) html += `<th>${colLetter(c)}</th>`;
  html += '</tr></thead><tbody>';
  for (let r=0;r<sheet.rows;r++){
    html += `<tr><td class="rownum">${r+1}</td>`;
    for (let c=0;c<sheet.cols;c++){
      const ref = colLetter(c)+(r+1);
      const raw = sheet.cells[ref] ?? '';
      const val = raw==='' ? '' : computeCell(sheet, ref);
      const disp = formatDisplay(sheet, ref, val);
      const isNum = typeof val === 'number';
      const isErr = typeof val === 'string' && val.startsWith('#');
      const isHdr = r===0;
      const isBold = !!(sheet.bold && sheet.bold[ref]);
      const isItalic = !!(sheet.italic && sheet.italic[ref]);
      const isUnderline = !!(sheet.underline && sheet.underline[ref]);
      const align = sheet.align && sheet.align[ref];
      const alignCls = align==='left'?'al-l':align==='center'?'al-c':align==='right'?'al-r':'';
      const tColor = sheet.textColor && sheet.textColor[ref];
      const fColor = sheet.fillColor && sheet.fillColor[ref];
      const cellStyle = (tColor?`color:${tColor};`:'') + (fColor?`background:${fColor};`:'');
      html += `<td><input class="cell-input ${isNum?'num':''} ${isErr?'err':''} ${isHdr?'hdr':''} ${isBold?'b':''} ${isItalic?'it':''} ${isUnderline?'un':''} ${alignCls}" data-ref="${ref}" ${cellStyle?`style="${cellStyle}"`:''} value="${escHtml(String(disp))}"></td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  scroll.innerHTML = html;
  wireGridEvents();
  renderCharts();
}

function wireGridEvents(){
  const sheet = currentSheet();
  document.querySelectorAll('.cell-input').forEach(inp=>{
    inp.addEventListener('focus', ()=>{
      selectedRef = inp.dataset.ref;
      document.getElementById('cellRefLabel').textContent = selectedRef;
      document.getElementById('formulaInput').value = sheet.cells[selectedRef] ?? '';
      document.getElementById('cellFormat').value = sheet.formats[selectedRef] || 'text';
      inp.value = sheet.cells[selectedRef] ?? '';
      updateToolbarState(sheet);
    });
    inp.addEventListener('blur', ()=> commitCell(inp.dataset.ref, inp.value));
    inp.addEventListener('keydown', (e)=>{
      if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); moveSelection(0,1); }
      if (e.key === 'Tab'){ e.preventDefault(); inp.blur(); moveSelection(1,0); }
      if (e.key === 'ArrowDown' && document.activeElement===inp){ }
    });
  });
}
function commitCell(ref, value){
  const sheet = currentSheet(); if (!sheet) return;
  if (value === '') delete sheet.cells[ref]; else sheet.cells[ref] = value;
  sheet.updatedAt = nowISO();
  saveDB();
  renderGrid();
  const inp = document.querySelector(`.cell-input[data-ref="${ref}"]`);
  if (inp && document.activeElement !== inp){ /* stays as computed display */ }
}
function moveSelection(dc, dr){
  const rc = refToRC(selectedRef);
  const sheet = currentSheet(); if (!sheet) return;
  const nr = Math.min(sheet.rows-1, Math.max(0, rc.r+dr));
  const nc = Math.min(sheet.cols-1, Math.max(0, rc.c+dc));
  const nref = colLetter(nc)+(nr+1);
  const el = document.querySelector(`.cell-input[data-ref="${nref}"]`);
  if (el) el.focus();
}
function focusCell(ref){
  const el = document.querySelector(`.cell-input[data-ref="${ref}"]`);

}

function sortByColumn(ascending){
  const sheet = currentSheet(); if (!sheet) return;
  const col = refToRC(selectedRef).c;
  const rowsData = [];
  for (let r=0;r<sheet.rows;r++){
    const rowObj = {};
    SHEET_STYLE_MAPS.forEach(m=> rowObj[m]={});
    for (let c=0;c<sheet.cols;c++){
      const ref = colLetter(c)+(r+1);
      SHEET_STYLE_MAPS.forEach(m=>{ if (sheet[m] && sheet[m][ref] !== undefined) rowObj[m][c] = sheet[m][ref]; });
    }
    rowObj.sortVal = sheet.cells[colLetter(col)+(r+1)]!==undefined ? computeCell(sheet, colLetter(col)+(r+1)) : '';
    rowsData.push(rowObj);
  }
  rowsData.sort((a,b)=>{
    let av=a.sortVal, bv=b.sortVal;
    const an = typeof av==='number', bn = typeof bv==='number';
    if (an && bn) return ascending ? av-bv : bv-av;
    av=(av??'').toString().toLowerCase(); bv=(bv??'').toString().toLowerCase();
    if (av<bv) return ascending?-1:1;
    if (av>bv) return ascending?1:-1;
    return 0;
  });
  const newMaps = {}; SHEET_STYLE_MAPS.forEach(m=> newMaps[m]={});
  rowsData.forEach((rowObj, newR)=>{
    SHEET_STYLE_MAPS.forEach(m=>{
      for (const c in rowObj[m]){ newMaps[m][colLetter(parseInt(c))+(newR+1)] = rowObj[m][c]; }
    });
  });
  SHEET_STYLE_MAPS.forEach(m=> sheet[m]=newMaps[m]);
  saveDB(); renderGrid();
  toast(ascending ? 'Trié par ordre croissant.' : 'Trié par ordre décroissant.');
}

function rangeValues(range){
  const [from,to] = range.split(':');
  const sheet = currentSheet();
  return rangeCells(from,to).map(ref => computeCell(sheet, ref));
}
function rangeMatrix(range){
  const [from,to] = range.split(':');
  const a = refToRC(from), b = refToRC(to);
  const width = Math.abs(b.c-a.c)+1;
  const vals = rangeValues(range);
  const rows = [];
  for (let i=0;i<vals.length;i+=width) rows.push(vals.slice(i,i+width));
  return rows;
}

function drawChart(canvas, cfg){
  if (!canvas) return;
  const rows = rangeMatrix(cfg.range);
  const hasHeaderRow = typeof rows[0][0] === 'string';
  const labels = hasHeaderRow ? rows.slice(1).map(r=>String(r[0])) : rows.map((r,i)=>'#'+(i+1));
  const dataRows = hasHeaderRow ? rows.slice(1) : rows;
  const series = dataRows.map(r => num(r[r.length-1]) || 0);

  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 260, h = canvas.clientHeight || 170;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const pad = 26;
  const ink = '#2E9C84', brass = '#D4A356', dim = '#9C9A92';
  const max = Math.max(...series, 0.0001), min = Math.min(0, ...series);

  ctx.font = '10px Inter, sans-serif'; ctx.fillStyle = dim;

  if (type_is(cfg.type,'bar','column')){
    const horizontal = cfg.type==='bar';
    const n = series.length;
    if (horizontal){
      const bh = (h-pad*1.5)/n;
      series.forEach((v,i)=>{
        const bw = (v/max) * (w-pad*2.2);
        ctx.fillStyle = ink;
        ctx.fillRect(pad*1.2, pad*0.4 + i*bh, bw, bh*0.65);
        ctx.fillStyle = dim; ctx.fillText(labels[i]?.slice(0,10)||'', 2, pad*0.4+i*bh+bh*0.45);
      });
    } else {
      const bw = (w-pad*1.5)/n;
      series.forEach((v,i)=>{
        const bh = ((v-min)/(max-min||1)) * (h-pad*1.6);
        ctx.fillStyle = ink;
        ctx.fillRect(pad*1.1 + i*bw, h-pad-bh, bw*0.6, bh);
        ctx.fillStyle = dim; ctx.fillText(labels[i]?.slice(0,6)||'', pad*1.1+i*bw, h-6);
      });
    }
  } else if (type_is(cfg.type,'line','area')){
    const n = series.length;
    const stepX = (w-pad*1.6)/Math.max(1,n-1);
    ctx.beginPath();
    series.forEach((v,i)=>{
      const x = pad*1.1 + i*stepX;
      const y = h-pad - ((v-min)/(max-min||1))*(h-pad*1.6);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    if (cfg.type==='area'){
      ctx.lineTo(pad*1.1+(n-1)*stepX, h-pad); ctx.lineTo(pad*1.1, h-pad); ctx.closePath();
      ctx.fillStyle = 'rgba(46,156,132,0.25)'; ctx.fill();
    }
    ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.stroke();
    series.forEach((v,i)=>{
      const x = pad*1.1 + i*stepX, y = h-pad - ((v-min)/(max-min||1))*(h-pad*1.6);
      ctx.fillStyle = brass; ctx.beginPath(); ctx.arc(x,y,2.4,0,7); ctx.fill();
    });
  } else if (cfg.type==='pie'){
    const total = series.reduce((s,v)=>s+Math.max(0,v),0) || 1;
    let a0 = -Math.PI/2;
    const cx=w/2, cy=h/2, r=Math.min(w,h)/2 - 8;
    const palette = ['#2E9C84','#D4A356','#5B7FBF','#C1554A','#8E6BB0','#4FA3A0','#B8863B'];
    series.forEach((v,i)=>{
      const a1 = a0 + (Math.max(0,v)/total)*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
      ctx.fillStyle = palette[i%palette.length]; ctx.fill();
      a0 = a1;
    });
  } else if (cfg.type==='scatter'){
    const xs = dataRows.map(r=>num(r[0])||0);
    const ys = series;
    const maxX=Math.max(...xs,1), minX=Math.min(0,...xs), maxY=Math.max(...ys,1), minY=Math.min(0,...ys);
    xs.forEach((x,i)=>{
      const px = pad + ((x-minX)/(maxX-minX||1))*(w-pad*1.6);
      const py = h-pad - ((ys[i]-minY)/(maxY-minY||1))*(h-pad*1.6);
      ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(px,py,3,0,7); ctx.fill();
    });
  } else if (cfg.type==='radar'){
    const n = series.length; const cx=w/2, cy=h/2, r=Math.min(w,h)/2-14;
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    for (let ring=1; ring<=3; ring++){
      ctx.beginPath();
      for (let i=0;i<=n;i++){ const a=-Math.PI/2 + i*(2*Math.PI/n); const rr=r*ring/3;
        const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.stroke();
    }
    ctx.beginPath();
    series.forEach((v,i)=>{
      const a=-Math.PI/2 + i*(2*Math.PI/n); const rr = (v/max)*r;
      const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.closePath(); ctx.strokeStyle=ink; ctx.fillStyle='rgba(46,156,132,0.25)'; ctx.fill(); ctx.stroke();
  }
}
function type_is(t,...opts){ return opts.includes(t); }

/* ---------- Utilitaires Agent Tableur ---------- */
function detectSheetErrors(){
  const sheet = currentSheet(); if (!sheet) return [];
  const issues = [];
  Object.keys(sheet.cells).forEach(ref=>{
    const v = computeCell(sheet, ref);
    if (typeof v === 'string' && v.startsWith('#')){
      issues.push({ ref, msg: v === '#DIV/0!' ? 'Division par zéro' : v === '#CIRC!' ? 'Référence circulaire' : v === '#NOM?' ? 'Fonction inconnue' : v === '#N/A' ? 'Valeur non trouvée' : 'Erreur de formule' });
    }
  });
  return issues;
}
function sheetToCSV(maxRows){
  const sheet = currentSheet(); if (!sheet) return '';
  const rows = [];
  for (let r=0;r<Math.min(sheet.rows,maxRows||sheet.rows);r++){
    const rowHasData = Array.from({length:sheet.cols},(_,c)=>sheet.cells[colLetter(c)+(r+1)]).some(v=>v);
    if (!rowHasData && r>0) continue;
    const cells = [];
    for (let c=0;c<sheet.cols;c++){
      const ref = colLetter(c)+(r+1);
      if (!sheet.cells[ref] && !rowHasData) continue;
      cells.push(String(computeCell(sheet, ref) ?? ''));
    }
    if (cells.some(v=>v!=='')) rows.push(cells.join(','));
  }
  return rows.join('\n');
}
function linearForecast(vals, n){
  const xs = vals.map((_,i)=>i);
  const N = vals.length;
  const sx = xs.reduce((s,v)=>s+v,0), sy = vals.reduce((s,v)=>s+v,0);
  const sxy = xs.reduce((s,x,i)=>s+x*vals[i],0), sxx = xs.reduce((s,x)=>s+x*x,0);
  const denom = (N*sxx - sx*sx) || 1;
  const b = (N*sxy - sx*sy) / denom;
  const a = (sy - b*sx) / N;
  const out = [];
  for (let i=0;i<n;i++) out.push(a + b*(N+i));
  return out;
}

/* ---------- Export .xlsx (OOXML réel, zippé via JSZip) ---------- */
async function buildXlsxBlob(sheet){
  if (typeof JSZip === 'undefined'){ toast('Bibliothèque XLSX indisponible hors ligne (JSZip non chargé).', true); return null; }
  const zip = new JSZip();
  const FMT_ID = { currency: 164, percent: 165, number: 166 };

  let rowsXml = '';
  for (let r=0;r<sheet.rows;r++){
    let cellsXml = '';
    let rowHasData = false;
    for (let c=0;c<sheet.cols;c++){
      const ref = colLetter(c)+(r+1);
      const raw = sheet.cells[ref];
      if (raw === undefined) continue;
      rowHasData = true;
      const v = computeCell(sheet, ref);
      const fmt = sheet.formats[ref];
      const sAttr = fmt==='currency' ? ' s="1"' : fmt==='percent' ? ' s="2"' : fmt==='number' ? ' s="3"' : '';
      if (typeof v === 'number'){
        cellsXml += `<c r="${ref}"${sAttr}><v>${v}</v></c>`;
      } else {
        cellsXml += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${escHtml(String(v))}</t></is></c>`;
      }
    }
    if (rowHasData) rowsXml += `<row r="${r+1}">${cellsXml}</row>`;
  }

  zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>
</Types>`);

  zip.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>
<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>
</Relationships>`);

  zip.file('docProps/core.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${escHtml(sheet.title)}</dc:title><dc:creator>Office Songda</dc:creator><cp:lastModifiedBy>Office Songda</cp:lastModifiedBy></cp:coreProperties>`);

  zip.file('docProps/app.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>Office Songda</Application></Properties>`);

  zip.file('xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="${escHtml((sheet.title||'Feuille').slice(0,30))}" sheetId="1" r:id="rId1"/></sheets>
</workbook>`);

  zip.file('xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`);

  zip.file('xl/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="3">
<numFmt numFmtId="${FMT_ID.currency}" formatCode="#,##0&quot; FCFA&quot;"/>
<numFmt numFmtId="${FMT_ID.percent}" formatCode="0.0%"/>
<numFmt numFmtId="${FMT_ID.number}" formatCode="#,##0.###"/>
</numFmts>
<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>
<fills count="1"><fill><patternFill patternType="none"/></fill></fills>
